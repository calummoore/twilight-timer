name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# One run per branch at a time. Pull request runs cancel older runs; main
# runs queue, so that two deploys never overlap.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # The deploy step holds a Cloudflare token, so skip the shared cache.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Validate Cloudflare configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error title=Missing CLOUDFLARE_ACCOUNT_ID::Set the repository variable CLOUDFLARE_ACCOUNT_ID."
            missing=1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error title=Missing CLOUDFLARE_API_TOKEN::Set the repository secret CLOUDFLARE_API_TOKEN."
            missing=1
          fi
          exit "${missing}"

      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
