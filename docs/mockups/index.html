<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TI4 Nexus — Mockups</title>
<style>
:root{
  --bg:#05070b; --panel:#0b1017; --panel2:#111925; --panel3:#18222f;
  --line:#1d2836; --line2:#2a3849;
  --txt:#e9eff7; --dim:#8e9bad; --faint:#5b6878;
  --accent:#5ce1d6; --accent-d:#0f3f3d;
  --warn:#f2ab45; --danger:#ff5a4d; --ok:#4ad07a;

  --c-red:#e2453c; --c-blue:#3d8ee6; --c-green:#31ab60; --c-yellow:#dfb833;
  --c-purple:#9257da; --c-orange:#e8802e; --c-pink:#e56fa8; --c-black:#7c8797;

  --r:14px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt); font-family:var(--f);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
[data-clock].over{color:var(--danger)}

/* ─────────── prototype chrome ─────────── */
.app{display:grid; grid-template-columns:246px 1fr; height:100vh}

.nav{
  background:#080b11; border-right:1px solid var(--line);
  padding:20px 0; overflow-y:auto; display:flex; flex-direction:column;
}
.nav h1{font-size:14px; letter-spacing:.14em; text-transform:uppercase; padding:0 20px 2px; color:var(--txt)}
.nav .sub{font-size:11px; color:var(--faint); padding:0 20px 20px; line-height:1.5}
.nav-group{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint);
  padding:16px 20px 8px; border-top:1px solid var(--line); margin-top:8px}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:8px 20px; font-size:13px;
  color:var(--dim); cursor:pointer; user-select:none;
}
.nav-item:hover{color:var(--txt); background:#0d121a}
.nav-item.on{color:var(--txt); background:#0e1620}
.nav-item .idx{font-size:10px; color:var(--faint); width:16px; flex:none}
.nav-item.on .idx{color:var(--accent)}
.nav-foot{margin-top:auto; padding:18px 20px 0; font-size:11px; color:var(--faint); line-height:1.6; border-top:1px solid var(--line)}
kbd{background:var(--panel2); border:1px solid var(--line2); border-radius:4px; padding:1px 5px; font:inherit; font-size:10px}

.stage{display:flex; flex-direction:column; min-width:0; overflow:hidden}
.stage-head{padding:18px 28px 14px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:14px}
.stage-head h2{font-size:17px; font-weight:600}
.stage-head .tag{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent);
  border:1px solid var(--accent-d); background:#0a1f1e; padding:3px 8px; border-radius:20px}
.stage-body{flex:1; display:flex; align-items:center; justify-content:center; padding:24px; min-height:0; overflow:hidden}
.stage-note{padding:14px 28px 18px; border-top:1px solid var(--line); font-size:12.5px; color:var(--dim);
  line-height:1.65; max-width:1100px}
.stage-note b{color:var(--txt); font-weight:600}

.frame-wrap{position:relative}
.frame{
  position:absolute; top:0; left:0; transform-origin:top left;
  background:var(--bg); overflow:hidden; color:var(--txt);
  box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 0 1px var(--line2), 0 0 0 12px #0b0e13, 0 0 0 13px #222c39;
}
.frame.ipad{width:1194px; height:834px; border-radius:20px}
.frame.phone{width:393px; height:852px; border-radius:38px}
.screen{display:none; position:absolute; inset:0}
.screen.active{display:block}

/* ─────────── shared app UI ─────────── */
.space{
  position:absolute; inset:0;
  background:
    radial-gradient(900px 500px at 78% -12%, #10243a 0%, transparent 62%),
    radial-gradient(700px 460px at 6% 108%, #1a1430 0%, transparent 60%),
    var(--bg);
}
.lay{position:absolute; inset:0; display:flex; flex-direction:column}

/* top bar */
.top{display:flex; align-items:center; gap:16px; padding:14px 22px; border-bottom:1px solid var(--line); flex:none}
.top .round{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint)}
.top .round b{color:var(--txt); font-weight:600}
.phase-pill{display:flex; gap:4px; background:#0a0e14; border:1px solid var(--line); border-radius:9px; padding:3px}
.phase-pill span{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); padding:5px 11px; border-radius:6px}
.phase-pill span.on{background:var(--accent); color:#04211f; font-weight:700}
.phase-pill span.done{color:#4e6a68}
.top .spacer{flex:1}
.top .gt{font-size:12px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase}
.top .gt b{color:var(--txt); font-size:16px; font-weight:600; margin-left:7px; letter-spacing:0}

.ibtn{display:flex; align-items:center; gap:7px; background:var(--panel2); border:1px solid var(--line2);
  color:var(--dim); font-size:12px; font-weight:600; padding:8px 13px; border-radius:9px; cursor:pointer; font-family:var(--f)}
.ibtn:hover{color:var(--txt); border-color:#3a4c62}
.ibtn.warnish{color:var(--warn); border-color:#4a3a1c; background:#1d160a}
/* icon-only button: an 18px SVG icon, stretched to the height of the buttons beside it */
.ibtn.icon{align-self:stretch; padding:0 8px}
.ibtn.icon svg{width:18px; height:18px; fill:currentColor}

/* body grid */
.body{flex:1; display:grid; grid-template-columns:1fr 428px; gap:18px; padding:18px 22px 20px; min-height:0}

/* active player hero */
.hero{background:linear-gradient(180deg,var(--panel) 0%,#080c12 100%);
  border:1px solid var(--line); border-radius:var(--r); padding:24px 28px; display:flex; flex-direction:column; min-height:0; position:relative; overflow:hidden}
.hero{border-color:color-mix(in srgb,var(--pc) 45%, var(--line))}
.hero.over{border-color:#5a2320; background:linear-gradient(180deg,#1a0c0b 0%,#0a0607 100%)}
.hero-top{display:flex; align-items:flex-start; gap:16px}
.dot{width:20px; height:20px; border-radius:50%; background:var(--pc); flex:none; margin-top:9px;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--pc) 22%, transparent)}
.hero h3{font-size:46px; font-weight:700; letter-spacing:-.02em; line-height:1.05}
.hero .fac{font-size:15px; color:var(--dim); margin-top:5px}
.hero .init{margin-left:auto; text-align:right}
.hero .init .n{font-size:52px; font-weight:800; color:var(--pc); line-height:1; letter-spacing:-.03em}
.hero .init .l{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); margin-top:4px}

.bigclock{font-size:186px; font-weight:800; letter-spacing:-.055em; line-height:.9; margin:auto 0 0;
  text-align:center; color:var(--txt)}
.hero.over .bigclock{color:var(--danger)}
.clock-sub{text-align:center; font-size:13px; color:var(--faint); margin-top:8px; letter-spacing:.06em}
.clock-sub b{color:var(--dim)}
.hero.over .clock-sub b{color:var(--danger)}

.limitbar{height:7px; background:#131b25; border-radius:4px; margin-top:20px; overflow:hidden}
.limitbar i{display:block; height:100%; background:var(--pc); border-radius:4px; transition:width .9s linear}
.hero.over .limitbar i{background:var(--danger)}
.limitrow{display:flex; justify-content:space-between; font-size:11px; color:var(--faint); margin-top:8px;
  letter-spacing:.1em; text-transform:uppercase}

.alarm{display:flex; align-items:center; gap:11px; background:#3a110d; border:1px solid #7a2a22;
  border-radius:10px; padding:11px 15px; margin-bottom:16px; animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{background:#3a110d}50%{background:#521812}}
.alarm .b{font-size:13px; font-weight:700; color:#ffb4ad; letter-spacing:.05em}
.alarm .s{font-size:12px; color:#d08d86}
.alarm .ico{font-size:17px}

/* action buttons */
.acts{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px; flex:none}
.acts.two{grid-template-columns:1fr 1fr 1fr}
.acts.two .sec{font-size:14px; text-wrap:balance}
.big{grid-column:1/-1; background:linear-gradient(180deg,#25d3c5,#12a89c); color:#032422; border:none;
  font-family:var(--f); font-size:29px; font-weight:800; letter-spacing:.04em; padding:24px; border-radius:13px;
  cursor:pointer; box-shadow:0 8px 0 #0a5f58, 0 14px 30px rgba(18,168,156,.28)}
.big:active{transform:translateY(3px); box-shadow:0 5px 0 #0a5f58}
.big.red{background:linear-gradient(180deg,#ff6b5e,#d63c30); color:#2a0704; box-shadow:0 8px 0 #7d211a,0 14px 30px rgba(214,60,48,.28)}
/* The solid shadow draws an 8 px edge under the big button. The margin keeps the full gap from the edge to the buttons below. */
.acts .big{margin-bottom:8px}
.sec{background:var(--panel2); border:1px solid var(--line2); color:var(--txt); font-family:var(--f);
  font-size:15px; font-weight:600; padding:17px; border-radius:11px; cursor:pointer; text-align:left}
.sec:hover{border-color:#3d5168; background:var(--panel3)}
.sec .k{display:block; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:4px}
.sec.hl{border-color:#3c5f77; background:#0e1f2b}
.sec.hl .k{color:var(--accent)}

/* initiative rail */
.rail{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); display:flex; flex-direction:column; min-height:0; overflow:hidden}
.rail-h{display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-bottom:1px solid var(--line); flex:none}
.rail-h .t{font-size:11px; letter-spacing:.17em; text-transform:uppercase; color:var(--dim); font-weight:600}
.rail-h .c{font-size:11px; color:var(--faint)}
.rail-b{overflow-y:auto; padding:7px; flex:1}
.row{display:grid; grid-template-columns:30px 1fr auto; gap:11px; align-items:center;
  padding:11px 11px; border-radius:10px; position:relative; margin-bottom:3px}
.row .in{font-size:19px; font-weight:800; color:var(--pc); text-align:center; letter-spacing:-.02em}
.row .nm{font-size:17px; font-weight:650; display:flex; align-items:center; gap:8px}
.row .nm i{width:9px; height:9px; border-radius:50%; background:var(--pc); flex:none; font-style:normal}
.row .fc{font-size:11.5px; color:var(--faint); margin-top:2px}
.row .fc .fn{white-space:nowrap}
.row .tm{text-align:right}
.row .tm .a{font-size:17px; font-weight:700; letter-spacing:-.01em}
.row .tm .b{font-size:11px; color:var(--faint); margin-top:2px}
.row.active{background:color-mix(in srgb,var(--pc) 14%, #0b111a); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 45%, transparent)}
.row.passed{opacity:.42}
.row.passed .nm{text-decoration:line-through; text-decoration-color:var(--faint)}
.chip{position:absolute; right:11px; top:-6px; font-size:9px; letter-spacing:.14em; text-transform:uppercase;
  padding:2px 7px; border-radius:20px; font-weight:700}
.chip.now{background:var(--accent); color:#04211f}
.chip.pass{background:#242f3d; color:#7c8b9d}
.chip.sc{background:#123044; color:#79c4e8}
.sccard{display:inline-block; font-size:10px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
  padding:2px 7px; border-radius:5px; margin-right:7px; background:#0f2a3c; color:#7fc8ec; border:1px solid #24506b}
.sccard.used{background:#141b24; color:#5c6a79; border-color:#27313d}
.rail-f{border-top:1px solid var(--line); padding:11px 16px; display:flex; justify-content:space-between;
  font-size:11px; color:var(--faint); letter-spacing:.06em; flex:none}

/* generic panels */
.pnl{background:var(--panel); border:1px solid var(--line); border-radius:var(--r)}
.pnl-h{padding:14px 18px; border-bottom:1px solid var(--line); font-size:11px; letter-spacing:.17em;
  text-transform:uppercase; color:var(--dim); font-weight:600; display:flex; justify-content:space-between; align-items:center}
.content{flex:1; padding:20px 22px; overflow:auto; min-height:0}
.h1{font-size:30px; font-weight:700; letter-spacing:-.02em}
.h1s{font-size:13.5px; color:var(--dim); margin-top:6px}

/* setup */
.setup-grid{display:grid; grid-template-columns:1fr 330px; gap:18px; height:100%; min-height:0}
.seat{display:grid; grid-template-columns:26px 34px 132px 1fr 150px 44px; gap:11px; align-items:center;
  padding:11px; border:1px solid var(--line); border-radius:11px; margin-bottom:9px; background:#0a0f16}
.seat.sp{border-color:#4d4322; background:#14110a}
.seat .sn{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); text-align:center}
.fld{background:#121a24; border:1px solid var(--line2); border-radius:8px; padding:9px 11px; font-size:14px; color:var(--txt); font-family:var(--f)}
.fld.sel{color:var(--dim); font-size:13px}
.swatches{display:flex; gap:5px}
.sw{width:22px; height:22px; border-radius:6px; background:var(--pc); opacity:.28; cursor:pointer}
.sw.on{opacity:1; box-shadow:0 0 0 2px #0a0f16, 0 0 0 4px var(--pc)}
.spk{width:32px; height:32px; border-radius:50%; border:1px solid var(--line2); display:grid; place-items:center;
  font-size:14px; color:var(--faint); cursor:pointer}
.spk.on{border-color:#8a7530; background:#2a2210; color:#f0cf6a}
.count{display:flex; gap:6px}
.count b{flex:1; text-align:center; padding:11px 0; border:1px solid var(--line2); border-radius:9px;
  font-size:16px; color:var(--dim); cursor:pointer; font-weight:600}
.count b.on{background:var(--accent); border-color:var(--accent); color:#04211f}
.kv{display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); font-size:13.5px}
.kv span{color:var(--dim)} .kv b{font-weight:600}
.fld.sel.none{color:var(--faint)}
.setup-need{font-size:12.5px; color:var(--warn); text-align:center; margin-bottom:10px}
/* expansions: one chip for each, and the random deal for the empty seats */
.exps{margin-bottom:14px}
.exps .lbl{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin-bottom:8px}
.exp-row{display:flex; flex-wrap:wrap; gap:6px}
.exp{display:flex; align-items:center; gap:6px; padding:7px 12px 7px 10px; border:1px solid var(--line2); border-radius:20px;
  background:#0a0f16; color:var(--faint); font-family:var(--f); font-size:12.5px; font-weight:600; cursor:pointer}
.exp::before{content:"+"; width:10px; text-align:center; font-weight:800}
.exp.on{border-color:#2b6b66; background:#0b1c1f; color:var(--txt)}
.exp.on::before{content:"✓"; color:var(--accent)}
.deal{width:100%; margin-bottom:12px; padding:13px; border:1px solid var(--line2); border-radius:11px; background:var(--panel2);
  color:var(--txt); font-family:var(--f); font-size:15px; font-weight:650; text-align:center; cursor:pointer}
.deal:hover{border-color:#3d5168; background:var(--panel3)}

/* settings */
.set-row{display:grid; grid-template-columns:1fr 200px 62px; gap:14px; align-items:center; padding:15px 18px;
  border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row .lb{font-size:15px; font-weight:600}
.set-row .ds{font-size:12px; color:var(--faint); margin-top:3px; line-height:1.45}
.set-row.off{opacity:.34}
.stepper{display:flex; align-items:center; gap:0; border:1px solid var(--line2); border-radius:9px; overflow:hidden}
.stepper b{flex:1; text-align:center; font-size:17px; font-weight:700; padding:9px 0}
.stepper i{width:38px; text-align:center; padding:9px 0; color:var(--dim); background:#121a24; cursor:pointer; font-style:normal; font-size:15px}
.tog{width:52px; height:30px; border-radius:16px; background:#1e2836; position:relative; cursor:pointer; justify-self:end}
.tog::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#5d6c7e; transition:.2s}
.tog.on{background:var(--accent)} .tog.on::after{left:25px; background:#04211f}
.master{display:flex; align-items:center; gap:16px; padding:17px 20px; background:#0d1620;
  border:1px solid #23404b; border-radius:12px; margin-bottom:18px}
.master .lb{font-size:16px; font-weight:700} .master .ds{font-size:12.5px; color:var(--dim); margin-top:3px}

/* strategy cards */
.cards{display:grid; grid-template-columns:repeat(4,1fr); gap:13px}
.card{border:1px solid var(--line2); border-radius:12px; padding:15px; background:#0a0f16; position:relative; min-height:132px;
  display:flex; flex-direction:column}
.card .n{font-size:38px; font-weight:800; letter-spacing:-.04em; color:var(--faint); line-height:1}
.card .nm{font-size:15px; font-weight:650; margin-top:5px}
.card.taken{background:color-mix(in srgb,var(--pc) 12%, #0a0f16); border-color:color-mix(in srgb,var(--pc) 55%, transparent)}
.card.taken .n{color:var(--pc)}
.card .own{margin-top:auto; display:flex; align-items:center; gap:8px; font-size:14px; font-weight:650}
.card .own i{width:11px; height:11px; border-radius:50%; background:var(--pc); font-style:normal}
.card .free{margin-top:auto; font-size:12px; color:var(--faint)}
.card .tg{position:absolute; top:12px; right:12px; background:#2a2410; border:1px solid #5e4f1c; color:#e8c95a;
  font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px}
.card.next{border-style:dashed; border-color:#33566b; background:#080e15}
.card.next .free{color:var(--accent); font-weight:600}
.picker{display:flex; align-items:center; gap:14px; background:#0d1620; border:1px solid #23404b;
  border-radius:12px; padding:14px 18px; margin-bottom:16px}
.picker .who{font-size:19px; font-weight:700; display:flex; align-items:center; gap:9px}
.picker .who i{width:13px; height:13px; border-radius:50%; background:var(--pc); font-style:normal}
.picker .lbl{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint)}
.picker .t{margin-left:auto; font-size:30px; font-weight:700; letter-spacing:-.02em}
.order-strip{display:flex; gap:7px; margin-top:16px; align-items:center; flex-wrap:wrap}
.order-strip .lbl{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin-right:5px}
.oc{display:flex; align-items:center; gap:7px; background:#0d131c; border:1px solid var(--line2); border-radius:20px; padding:5px 12px 5px 8px; font-size:13px; font-weight:600}
.oc i{width:9px; height:9px; border-radius:50%; background:var(--pc); font-style:normal}
.oc b{color:var(--pc); font-weight:800; font-size:12px}

/* naalu 0 token: the strip button and the picker dialog. The remove-player dialog uses the same player options. */
.order-strip .tokb{margin-left:auto}
.tokb b{color:var(--pc); font-weight:800; font-size:13px}
.tokopts{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:18px}
.tokopt{display:flex; align-items:center; gap:9px; padding:13px 14px; border:1px solid var(--line2); border-radius:11px;
  background:#0b111a; color:var(--txt); font-family:var(--f); font-size:15px; font-weight:650; cursor:pointer; text-align:left}
.tokopt i{width:10px; height:10px; border-radius:50%; background:var(--pc); flex:none; font-style:normal}
.tokopt .tag{margin-left:auto; font-size:9px; letter-spacing:.12em; text-transform:uppercase; padding:2px 7px;
  border-radius:20px; font-weight:700; background:var(--accent); color:#04211f}
.tokopt.on{background:color-mix(in srgb,var(--pc) 14%, #0b111a); border-color:color-mix(in srgb,var(--pc) 55%, transparent)}

/* reaction window */
.scrim{position:absolute; inset:0; background:rgba(2,4,7,.87); backdrop-filter:blur(7px)}
/* The top bar stays above the scrim: Pause, Undo, Settings, and the speaker chip work during a window. */
.top{position:relative; z-index:2}
.rw{position:absolute; inset:74px 60px 24px; background:linear-gradient(180deg,#0f1722,#080c12);
  border:1px solid #2b4a58; border-radius:20px; padding:26px 32px; display:flex; flex-direction:column;
  box-shadow:0 40px 110px rgba(0,0,0,.8)}
.rw-h{display:flex; align-items:center; gap:16px; flex:none}
.rw-h .lbl{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent)}
.rw-h h3{font-size:33px; font-weight:750; letter-spacing:-.02em; margin-top:5px}
.rw-h .by{font-size:14px; color:var(--dim); margin-top:5px; display:flex; align-items:center; gap:8px}
.rw-h .by i{width:10px; height:10px; border-radius:50%; background:var(--pc); font-style:normal}
.rw-clock{margin-left:auto; text-align:right}
.rw-clock .t{font-size:88px; font-weight:800; letter-spacing:-.05em; line-height:.92; color:var(--accent)}
.rw-clock .t.over{color:var(--danger)}
.rw-clock .l{font-size:10.5px; letter-spacing:.17em; text-transform:uppercase; color:var(--faint); margin-top:4px}
.rw-bar{height:6px; background:#131b25; border-radius:4px; margin:20px 0 22px; overflow:hidden; flex:none}
.rw-bar i{display:block; height:100%; background:var(--accent); transition:width .9s linear}
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:13px; flex:1; min-height:0}
.tile{border:1px solid var(--line2); border-radius:13px; padding:17px; background:#0b111a; display:flex; flex-direction:column; position:relative}
.tile .nm{font-size:19px; font-weight:700; display:flex; align-items:center; gap:9px}
.tile .nm i{width:11px; height:11px; border-radius:50%; background:var(--pc); font-style:normal}
.tile .fc{font-size:11.5px; color:var(--faint); margin-top:3px}
.tile .st{margin-top:auto; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase}
.tile.done{background:#0a1c13; border-color:#2a5c3d}
.tile.done .st{color:var(--ok)}
.tile.wait .st{color:var(--warn)}
.tile .tapme{margin-top:auto; background:var(--panel3); border:1px solid #3c5168; color:var(--txt);
  font-family:var(--f); font-size:14px; font-weight:700; padding:12px; border-radius:9px; cursor:pointer; letter-spacing:.04em}
.tile .took{font-size:12px; color:var(--faint); margin-top:5px}
.tile .pchip{position:absolute; top:14px; right:14px; font-size:9px; letter-spacing:.12em; text-transform:uppercase;
  background:#242f3d; color:#7c8b9d; padding:2px 7px; border-radius:20px; font-weight:700}
.rw-f{display:flex; align-items:center; gap:12px; margin-top:20px; flex:none}
.rw-f .note{font-size:12.5px; color:var(--faint); line-height:1.5}
/* Politics: the new speaker */
.rw-spk{display:flex; align-items:center; gap:16px; padding:12px 14px; margin-bottom:16px; flex:none;
  border:1px solid #3a3218; border-radius:13px; background:#0f0d08}
.rw-spk .l{flex:none; width:190px}
.rw-spk .l b{display:block; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:#f0cf6a}
.rw-spk .l span{display:block; font-size:12.5px; color:var(--dim); margin-top:4px; line-height:1.4}
.rw-spk .opts{display:flex; gap:8px; flex:1; min-width:0}
.spkopt{flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:7px; padding:11px 8px;
  border:1px solid var(--line2); border-radius:10px; background:#0b111a; color:var(--txt);
  font-family:var(--f); font-size:14px; font-weight:700; cursor:pointer}
.spkopt i{width:10px; height:10px; border-radius:50%; background:var(--pc); font-style:normal; flex:none}
.spkopt .n{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.spkopt.on{border-color:#8a7530; background:#1a1509; color:#f0cf6a; box-shadow:0 0 0 1px #8a7530; cursor:default}

/* pause: the reason buttons on the pause card, and the time of the chosen reason */
.reasons{display:flex; gap:8px; width:440px; margin:0 auto}
.reasons button{flex:1; padding:16px 0; border:1px solid var(--line2); border-radius:11px; background:var(--panel2);
  font-family:var(--f); font-size:17px; font-weight:650; color:var(--dim); cursor:pointer}
.reasons button.on{background:var(--accent); border-color:var(--accent); color:#04211f; cursor:default}
.reason-time{height:20px; margin:14px 0 30px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent)}
.reason-time b{font-size:16px; font-weight:700; letter-spacing:0; margin-left:8px}

/* status phase */
.steps{display:grid; gap:9px}
.step{display:flex; align-items:center; gap:14px; padding:15px 17px; border:1px solid var(--line); border-radius:11px; background:#0a0f16}
.step .bx{width:26px; height:26px; border-radius:7px; border:1.5px solid var(--line2); flex:none; display:grid; place-items:center; font-size:14px; color:transparent}
.step.on{background:#0a1a12; border-color:#2a5c3d}
.step.on .bx{background:var(--ok); border-color:var(--ok); color:#03230f}
.step.on .lb{color:var(--dim); text-decoration:line-through; text-decoration-color:#38505f}
.step .lb{font-size:15.5px; font-weight:600}
.step .no{margin-left:auto; font-size:12px; color:var(--faint)}
.tabletimer{text-align:center; padding:26px 0 22px}
.tabletimer .t{font-size:104px; font-weight:800; letter-spacing:-.05em; line-height:.9}
.tabletimer .l{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); margin-top:9px}

/* agenda */
.vote-row{display:grid; grid-template-columns:30px 1fr 116px 122px; gap:13px; align-items:center;
  padding:12px 14px; border:1px solid var(--line); border-radius:11px; margin-bottom:8px; background:#0a0f16}
.vote-row.now{border-color:var(--pc); background:color-mix(in srgb,var(--pc) 11%, #0a0f16)}
.vote-row.done{opacity:.55}
.vote-row .ord{font-size:12px; color:var(--faint); text-align:center}
.vote-row .nm{font-size:16px; font-weight:650; display:flex; align-items:center; gap:9px}
.vote-row .nm i{width:10px; height:10px; border-radius:50%; background:var(--pc); font-style:normal}
.vote-row .vt{font-size:16px; font-weight:700; text-align:right}
.vote-row .badge{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; text-align:center;
  padding:6px; border-radius:7px; background:#151e2a; color:var(--faint)}
.vote-row .badge.f{background:#0d2418; color:var(--ok)} .vote-row .badge.a{background:#2a1210; color:#ff8b80}
.vote-row .badge.ab{background:#1c1f26; color:#7a8798}
.agenda-card{background:linear-gradient(180deg,#171122,#0b0810); border:1px solid #3a2b52; border-radius:13px;
  padding:19px 22px; margin-bottom:16px}
.agenda-card .k{font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:#b58bef}
.agenda-card h4{font-size:23px; font-weight:700; margin-top:6px}
.agenda-card p{font-size:13px; color:var(--dim); margin-top:7px; line-height:1.5}

/* charts */
.bars{display:grid; gap:13px}
.bar-row{display:grid; grid-template-columns:112px 1fr 92px; gap:14px; align-items:center}
.bar-row .nm{font-size:14.5px; font-weight:650; display:flex; align-items:center; gap:8px}
.bar-row .nm i{width:10px; height:10px; border-radius:50%; background:var(--pc); font-style:normal}
.track{height:26px; background:#0d131c; border-radius:6px; overflow:hidden; display:flex}
.track u{display:block; height:100%; text-decoration:none}
.track u.ac{background:var(--pc)} .track u.win{background:color-mix(in srgb,var(--pc) 48%, #0d131c)}
.track u.ot{background:repeating-linear-gradient(45deg,var(--danger),var(--danger) 4px,#a8342b 4px,#a8342b 8px)}
.bar-row .vl{text-align:right; font-size:15px; font-weight:700}
.legend{display:flex; gap:18px; margin-top:18px; font-size:11.5px; color:var(--faint); flex-wrap:wrap}
.legend b{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:7px; vertical-align:-1px}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:13px; margin-bottom:20px}
.stat-grid.five{grid-template-columns:repeat(5,1fr)}
.stat{background:#0a0f16; border:1px solid var(--line); border-radius:12px; padding:16px 17px}
.stat .l{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
.stat .v{font-size:31px; font-weight:800; letter-spacing:-.03em; margin-top:7px}
.stat .s{font-size:11.5px; color:var(--faint); margin-top:4px}

/* history */
.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
.tbl th{text-align:left; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint);
  padding:0 12px 10px; font-weight:600}
.tbl td{padding:11px 12px; border-top:1px solid var(--line)}
.tbl tr.edited td{background:#141007}
.tbl .pl{display:flex; align-items:center; gap:8px; font-weight:650}
.tbl .pl i{width:9px; height:9px; border-radius:50%; background:var(--pc); font-style:normal}
.tbl .dur{font-weight:700; font-size:15px}
.tbl .ot{color:var(--danger); font-size:11.5px; margin-left:6px; font-weight:700}
.tbl .acts2{text-align:right; white-space:nowrap}
.mini{background:var(--panel2); border:1px solid var(--line2); color:var(--dim); font-family:var(--f);
  font-size:11.5px; font-weight:600; padding:6px 11px; border-radius:7px; cursor:pointer; margin-left:6px}
.mini:hover{color:var(--txt)}
.mini.dn{background:var(--accent); border-color:var(--accent); color:#04211f}
.editing td{background:#0c1721 !important}
.edit-box{display:flex; align-items:center; gap:12px; padding:6px 0}
.pill-note{background:#141007; border:1px solid #4a3a1c; color:var(--warn); font-size:11px; font-weight:700;
  padding:2px 8px; border-radius:20px; letter-spacing:.08em; text-transform:uppercase}
/* corrections — reversible state log */
.ev{display:grid; grid-template-columns:34px 1fr auto; gap:13px; align-items:center; padding:13px 15px;
  border:1px solid var(--line); border-radius:11px; margin-bottom:8px; background:#0a0f16; position:relative}
.ev .ico{width:34px; height:34px; border-radius:9px; background:#141d29; display:grid; place-items:center;
  font-size:15px; color:var(--dim)}
.ev .t{font-size:15px; font-weight:650}
.ev .d{font-size:12.5px; color:var(--dim); margin-top:3px; display:flex; align-items:center; gap:8px}
.ev .ago{font-size:11px; color:var(--faint); text-align:right; white-space:nowrap}
.ev.head{border-color:#2b4a58; background:#0c1620}
.ev.head .ico{background:#123a3a; color:var(--accent)}
.ev.sel{border-color:var(--warn); background:#16110a}
.ev.stale{opacity:.5}
.ev .hchip{position:absolute; top:-7px; left:14px; background:var(--accent); color:#04211f; font-size:9px;
  font-weight:800; letter-spacing:.14em; text-transform:uppercase; padding:2px 8px; border-radius:20px}
.cascade{grid-column:1/-1; border-top:1px solid #4a3a1c; margin-top:12px; padding-top:12px}
.cascade .w{font-size:13px; color:var(--warn); font-weight:650; display:flex; align-items:center; gap:9px}
.cascade .l{font-size:12.5px; color:var(--dim); line-height:1.6; margin-top:8px}
.cascade .l b{color:var(--txt); font-weight:600}
.cascade .btns{display:flex; gap:10px; margin-top:14px}
/* speaker & seating ring */
.ibtn.spkb{color:#f0cf6a; border-color:#5a4d22; background:#1a1509}
.ringwrap{position:relative; width:500px; height:410px; margin:0 auto}
.ringwrap::before{content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:300px; height:230px; border-radius:50%; border:1px dashed #263544; background:#080d14}
.ringwrap .cc{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; width:230px}
.ringwrap .cc .l{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint)}
.ringwrap .cc .v{font-size:19px; font-weight:700; margin-top:7px; color:#f0cf6a}
.ringwrap .cc .s{font-size:11.5px; color:var(--faint); margin-top:9px; line-height:1.5}
.seatnode{position:absolute; transform:translate(-50%,-50%); width:112px; padding:11px 8px; text-align:center;
  border:1px solid var(--line2); border-radius:12px; background:#0b111a; cursor:pointer}
.seatnode i{width:13px; height:13px; border-radius:50%; background:var(--pc); font-style:normal; display:block; margin:0 auto}
.seatnode .nm{font-size:15px; font-weight:700; margin-top:6px}
.seatnode .sn2{font-size:10.5px; color:var(--faint); margin-top:2px; letter-spacing:.08em; text-transform:uppercase}
.seatnode.isspk{border-color:#8a7530; background:#1a1509; box-shadow:0 0 0 1px #8a7530, 0 0 26px rgba(240,207,106,.14)}
.seatnode .tok{position:absolute; top:-11px; left:50%; transform:translateX(-50%); background:#f0cf6a; color:#2a2008;
  font-size:11px; font-weight:800; width:24px; height:24px; border-radius:50%; display:grid; place-items:center}
.seatnode .hint{position:absolute; bottom:-9px; left:50%; transform:translateX(-50%); white-space:nowrap;
  background:var(--accent); color:#04211f; font-size:9px; font-weight:800; letter-spacing:.1em;
  text-transform:uppercase; padding:2px 8px; border-radius:20px}
.seatnode.cand{border-style:dashed; border-color:#33566b}
/* the empty seat of a player who left the game */
.seatnode.out{opacity:.38; cursor:default}
.seatnode.out .nm{text-decoration:line-through; text-decoration-color:var(--faint)}
/* Re-order mode: every seat of a player in the game shakes, as on the iOS home screen. The shake turns the rotate
   property, so the transform that places the seat stays. The held seat lifts, stops shaking, and follows the finger. The
   seat under it slides into the gap. A device set to reduced motion shows a still dashed outline in place of the shake. */
.ringwrap .seatnode{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  transition:left .2s ease, top .2s ease, translate .2s ease}
.ringwrap.reorder .seatnode:not(.out){touch-action:none; animation:shake .26s ease-in-out infinite alternate}
.ringwrap.reorder .seatnode:nth-child(even){animation-direction:alternate-reverse}
.ringwrap.reorder .seatnode.held{z-index:2; scale:1.08; animation:none; transition:none; border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent), 0 12px 30px rgba(0,0,0,.55)}
@keyframes shake{from{rotate:-1.5deg} to{rotate:1.5deg}}
@media (prefers-reduced-motion: reduce){
  .ringwrap .seatnode{transition:none}
  .ringwrap.reorder .seatnode:not(.out){animation:none; outline:1px dashed var(--accent); outline-offset:3px}
}
.ibtn.reorder{justify-content:center; padding:13px}
.ibtn.reorder.on{color:var(--accent); border-color:#2b6b66; background:#0b1c1f}
.ordlist{display:flex; flex-direction:column; gap:5px}
.ordrow{display:grid; grid-template-columns:24px 1fr auto; gap:11px; align-items:center; padding:7px 12px;
  border:1px solid var(--line); border-radius:9px; background:#0a0f16; font-size:14px}
.ordrow .n2{font-size:12px; color:var(--faint); text-align:center; font-weight:700}
.ordrow .nm{font-weight:650; display:flex; align-items:center; gap:8px}
.ordrow .nm i{width:9px; height:9px; border-radius:50%; background:var(--pc); font-style:normal}
.ordrow .tag2{font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:800;
  padding:2px 7px; border-radius:20px; background:#2a2210; color:#f0cf6a}
.ordrow.isspk{border-color:#5a4d22; background:#14110a}
.drag{width:26px; text-align:center; color:#3d4a5a; font-size:15px; cursor:grab}
.undo-bar{display:flex; align-items:center; gap:18px; background:#0c1620; border:1px solid #2b4a58;
  border-radius:13px; padding:15px 18px; margin-bottom:16px}
.undo-bar .k{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint)}
.undo-bar .v{font-size:18px; font-weight:700; margin-top:5px}
.undo-bar .s{font-size:12.5px; color:var(--dim); margin-top:4px}
.ev .dur2{font-size:15px; font-weight:700; margin-right:14px}
.ev .dur2 s{text-decoration:none; color:var(--danger); font-size:11.5px; margin-left:5px}
.note-box{background:#0d1620; border:1px solid #23404b; border-radius:11px; padding:14px 16px;
  font-size:12.5px; color:var(--dim); line-height:1.65}
.note-box b{color:var(--txt); font-weight:600}
.undo-toast{position:absolute; left:50%; transform:translateX(-50%); bottom:24px; display:flex; align-items:center; gap:16px;
  background:#16202c; border:1px solid var(--line2); border-radius:12px; padding:13px 16px 13px 19px;
  box-shadow:0 16px 44px rgba(0,0,0,.6); font-size:13.5px}
.undo-toast b{font-weight:650}

/* home: a new game, a join code, and the recent games of this device */
.home-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.pad{padding:18px}
.home-help{font-size:13px; color:var(--dim); line-height:1.6; margin-bottom:16px}
/* home: both panels take one height, and the help text takes the free height, so New game lines up with Join game */
.home-grid > .pnl{display:flex; flex-direction:column}
.home-grid .pad{flex-grow:1; display:flex; flex-direction:column}
.home-grid .home-help{flex-grow:1}
.fld.code{font-size:26px; font-weight:800; letter-spacing:.3em; text-transform:uppercase; text-align:center; padding:14px; width:100%}
.fld.code.empty{color:var(--faint); letter-spacing:.08em; font-weight:500; font-size:15px}
.recent{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:12px 15px;
  border:1px solid var(--line); border-radius:11px; margin-bottom:8px; background:#0a0f16}
.recent .code{font-size:17px; font-weight:800; letter-spacing:.12em}
.recent .d{font-size:12.5px; color:var(--dim)}
/* home: a line under the code field when the code does not open a game */
.home-err{font-size:12.5px; color:var(--warn); line-height:1.5; margin-top:10px}
/* home: a game that an older build saved on this device has no code yet */
.recent.saved{grid-template-columns:1fr auto}
/* a saved game that cannot be read */
.notice{display:flex; align-items:center; gap:14px; background:#241408; border:1px solid #5b3a14; border-radius:11px;
  padding:12px 15px; margin-bottom:14px; font-size:13px; color:#f0c489}
.notice .ibtn{margin-left:auto}
/* opening a game: one card in the middle while the device connects, or when no game has the code */
.open-wait{display:grid; place-items:center}
.open-card{width:min(460px,100%); text-align:center}
.open-card .h1s{margin:8px 0 20px; line-height:1.5}

/* claim seat: one row per seat, with the device that holds it */
.claim-grid{display:grid; grid-template-columns:1fr 360px; gap:18px}
.seat-pick{display:flex; align-items:center; gap:13px; padding:15px; border:1px solid var(--line2);
  border-radius:13px; margin-bottom:10px; background:#0b111a; cursor:pointer}
.seat-pick i{width:26px; height:26px; border-radius:8px; background:var(--pc); flex:none; font-style:normal}
.seat-pick .nm{font-size:17px; font-weight:650}
.seat-pick .fc{font-size:12px; color:var(--faint); margin-top:2px}
.seat-pick .tk{margin-left:auto; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); text-align:right}
.seat-pick .tk.held{color:var(--warn)}
.seat-pick.you{border-color:var(--accent); background:#0a1a1c}
.seat-pick.you .tk{color:var(--accent)}

/* players & devices: the code, the link, the QR code, and the seats with their devices and requests */
.qr{width:250px; height:250px; background:#fff; border-radius:14px; padding:14px; display:grid;
  grid-template-columns:repeat(25,1fr); grid-template-rows:repeat(25,1fr)}
.qr u{background:#000; border-radius:1px}
.joincode{font-size:52px; font-weight:800; letter-spacing:.14em; margin-top:6px}
.joinlink{font-size:15px; color:var(--dim); margin-top:12px; overflow-wrap:anywhere}
.joinlink a{color:var(--accent); font-weight:600; text-decoration:underline; text-underline-offset:3px;
  text-decoration-color:color-mix(in srgb,var(--accent) 45%, transparent)}
.joinlink a:hover{text-decoration-color:currentColor}
/* Copy link sits under the link, and turns green for a moment after it copies */
.ibtn.copy{display:inline-flex; margin-top:14px}
.ibtn.copy.done{color:var(--ok); border-color:#1d4a2e; background:#0d2418}
.dev-row{display:grid; grid-template-columns:auto 1fr auto auto; gap:12px; align-items:center; padding:12px 15px;
  border:1px solid var(--line); border-radius:11px; margin-bottom:8px; background:#0a0f16}
.dev-row i{width:11px; height:11px; border-radius:50%; background:var(--pc); font-style:normal}
.dev-row .nm{font-size:15px; font-weight:650}
.dev-row .fc{font-size:11.5px; color:var(--faint); margin-top:2px}
.dev-row .st{font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; text-align:right}
.dev-row .st.ok{color:var(--ok)} .dev-row .st.no{color:var(--faint)} .dev-row .st.away{color:var(--warn)}
.dev-row .adm{display:flex; align-items:center; justify-content:flex-end; gap:8px; min-width:96px;
  font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
.dev-row.table{border-color:#2b4a58; background:#0c1620}
.you-tag{font-size:9px; letter-spacing:.12em; text-transform:uppercase; padding:2px 7px; border-radius:20px; font-weight:700; white-space:nowrap;
  background:var(--accent); color:#04211f; margin-left:8px; vertical-align:middle}
/* the lobby: Start game on an admin device, and the waiting line on every other device */
.lobby-help{flex:1; align-self:center; font-size:13px; color:var(--dim); line-height:1.5}
.lobby-wait{flex:1; display:flex; align-items:center; justify-content:center; gap:10px; padding:18px;
  border:1px dashed var(--line2); border-radius:13px; font-size:15px; color:var(--dim)}
.lobby-wait i{width:9px; height:9px; border-radius:50%; background:var(--accent); font-style:normal; animation:blink 1.1s ease-in-out infinite}

/* the device chip in the top bar: the seat of this device, or Table */
.top .chips{display:flex; gap:10px; flex-wrap:wrap}
.ibtn.youb{color:var(--txt); border-color:color-mix(in srgb,var(--pc) 55%, var(--line2)); background:color-mix(in srgb,var(--pc) 12%, var(--panel2))}
.ibtn.youb i{width:9px; height:9px; border-radius:50%; background:var(--pc); font-style:normal}
.ibtn.youb.table{--pc:var(--accent)}

/* a seated device: a disabled main control names the player that the game waits for */
.big .k{display:block; font-size:11px; letter-spacing:.16em; text-transform:uppercase; opacity:.75; margin-bottom:4px; font-weight:800}
.ibtn:disabled, .sec:disabled, .tile .tapme:disabled{opacity:.4; cursor:default}
.sec.muted:disabled .k{color:var(--faint)}
.tog:disabled, .tog.off{opacity:.4; cursor:default}

/* the device has no connection: the bar under the top bar says so, and every control waits */
.netbar{display:flex; align-items:center; justify-content:center; gap:10px; padding:9px 16px; flex:none; position:relative; z-index:5;
  background:#1d160a; border-bottom:1px solid #4a3a1c; color:var(--warn); font-size:12.5px; font-weight:700; letter-spacing:.06em}
.netbar i{width:9px; height:9px; border-radius:50%; background:var(--warn); font-style:normal; animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.offline .body, .offline .content, .offline .foot{opacity:.5; pointer-events:none}

/* ─────────── app controls that the screens share, as the app draws them ─────────── */
.overlay{position:fixed; inset:0; background:rgba(2,4,7,.87); backdrop-filter:blur(7px); display:grid; place-items:center; z-index:10;
  overflow-y:auto; padding:16px}
/* Auto margins centre the card while it fits. A card taller than the window starts at the top, and the overlay scrolls. */
.overlay > *{margin:auto}
.dialog{width:520px; background:#121a24; border:1px solid var(--line2); border-radius:20px; padding:28px}
.dialog h3{font-size:25px; font-weight:750}
.dialog p{font-size:14.5px; color:var(--dim); margin-top:10px; line-height:1.55}
.dialog .heir{margin-top:16px; color:#f0cf6a}
.dialog .btns{display:flex; gap:12px; margin-top:24px; justify-content:flex-end}
.pause-card{text-align:center}
.pause-card .t{font-size:120px; font-weight:800; letter-spacing:-.05em; line-height:.9}
.pause-card .l{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); margin:14px 0 34px}
.big.small{grid-column:auto; font-size:19px; padding:16px 26px}
.big.lg{font-size:23px; padding:21px}
.big.md{font-size:20px; padding:19px}
.big:disabled{opacity:.45; cursor:default}
.sec.muted .k{color:var(--warn)}
.clock-over{color:var(--danger)}
.pnl-note{text-transform:none; letter-spacing:0; font-weight:400; color:var(--faint)}
.setup-label{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin-bottom:9px}
.setup-help{font-size:12px; color:var(--faint); line-height:1.6; margin-top:18px}
.setup-help b{color:var(--dim)}
.setup-help + .setup-help{margin-top:12px}
/* The faction column grows to fit the longest faction name before the name column takes the rest. */
.seat{grid-template-columns:26px 34px minmax(103px,216px) minmax(120px,1fr) minmax(96px,max-content) 44px}
/* The seat rows share the columns of the seat list, so the faction column has one width in every row, also when one seat
   keeps a faction that the other lists leave out. Under subgrid, the padding and the border of a row take 12 px from its
   first and last columns, so those columns are 12 px wider. A browser without subgrid keeps the columns of each row. */
.seat-list{display:grid; grid-template-columns:38px 34px minmax(103px,216px) minmax(120px,1fr) minmax(96px,max-content) 56px;
  column-gap:11px; align-content:start}
.seat-list .seat{grid-column:1 / -1; grid-template-columns:subgrid}
.seat .swatches{flex-wrap:wrap}
.seat-move{display:flex; flex-direction:column; gap:2px}
.seat-move b{color:var(--faint); font-size:11px; font-weight:400; line-height:1; padding:3px 0; border-radius:5px; text-align:center}
.seat-move b.off{opacity:.25}
.picker .spkb{margin-left:6px; padding:10px 14px}
.picker-help{font-size:12.5px; color:var(--faint); line-height:1.5; margin-left:22px; max-width:250px}
.order-help{font-size:11.5px; color:var(--faint); margin-top:8px; line-height:1.5}
.ord-body{padding:11px 14px}
.tile-idle{border-style:dashed; opacity:.5; justify-content:center; align-items:center; font-size:13px; color:var(--faint);
  text-align:center; line-height:1.5}
.rw-f .spacer{flex:1}
.custodians{display:flex; align-items:center; gap:14px; padding:15px 18px}
.custodians .lb{font-size:14.5px; font-weight:600}
.custodians .ds{font-size:12px; color:var(--faint); margin-top:3px}
.voter-now{padding:18px; display:flex; flex-direction:column; gap:14px}
.voter-now .who{font-size:22px; font-weight:700; display:flex; align-items:center; gap:10px}
.voter-now .who i{width:12px; height:12px; border-radius:50%; background:var(--pc); font-style:normal}
.voter-now .t{font-size:56px; font-weight:800; letter-spacing:-.04em}
.voter-now .ds{font-size:13px; color:var(--faint)}
.tabletimer .t.md{font-size:78px}
.phase-line{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px}
.long-turn .pl{display:flex; align-items:center; gap:8px}
.long-turn .pl i{width:9px; height:9px; border-radius:50%; background:var(--pc); font-style:normal}
.join-grid{display:grid; grid-template-columns:1fr 1fr; gap:34px; align-items:center; padding:0 60px}

/* ─────────── layout helpers: the screens use these in place of inline grids ─────────── */
.split{display:grid; grid-template-columns:1fr var(--side,420px); gap:18px}
.col{display:flex; flex-direction:column; gap:16px; min-height:0}
.col > *{margin-top:0; margin-bottom:0}
.grow{flex:1; min-height:0}
.scroll{overflow:auto; min-height:0}
.foot{display:flex; gap:12px; padding:0 22px 20px; flex:none}
.foot .big{flex:1}
.foot .ibtn{padding:18px 24px}
.tools{display:flex; gap:16px}
.ph-now{display:none}
.evr{display:flex; align-items:center}

/* The top bar stays above a reaction window, so the table can still pause, undo or move the speaker. */
.top.game{position:relative; z-index:5}
.rw{inset:calc(var(--top-h, 68px) + 16px) 60px 30px; overflow-y:auto}
.rw .tiles{flex:1 0 auto}
:has(.rw) .top.game{position:sticky; top:0}
/* Overlays stay put while a narrow screen scrolls under them. */
.scrim, .rw{position:fixed}

/* The seating ring keeps its proportions at any width. */
.ringwrap{width:100%; max-width:500px; height:auto; aspect-ratio:500/410}
.ringwrap::before{width:60%; height:56%}
.ringwrap .cc{width:46%}

/* ─────────── designed, but not in the app yet ─────────── */
.later{opacity:.5; outline:1px dashed #66768a; outline-offset:3px}
.later-tag{display:inline-block; vertical-align:middle; margin-left:8px; padding:2px 7px; border-radius:20px; background:#242f3d;
  color:#a9b8c9; font-size:9px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; font-style:normal; line-height:1.3}

/* ─────────── device frames ─────────── */
/* Each screen is drawn once. Its screen box plays the app's stage: it sits inside the device's safe area and is a
   size container, and the queries below arrange the screen for it. Layout containment holds the fixed overlays inside
   it, as in the app. */
.screen.table{container:app / size; contain:layout}
.frame.tablet{width:834px; height:1194px; border-radius:20px}
.frame.tablet .screen.table{inset:24px 0 20px}
.frame.phone .screen.table{inset:54px 0 34px}
.frame.phone::after{content:""; position:absolute; top:11px; left:50%; width:124px; height:36px; margin-left:-62px;
  border-radius:20px; background:#000; z-index:50}
.frame.phone::before, .frame.tablet::before{content:""; position:absolute; bottom:8px; left:50%; width:138px; height:5px;
  margin-left:-69px; border-radius:3px; background:#e9eff7; opacity:.45; z-index:50}

/* ─────────── narrow: an upright iPad or a phone ─────────── */
@container app (max-width: 900px){
  .lay{overflow-y:auto; scrollbar-width:none}
  .lay::-webkit-scrollbar{display:none}
  .lay > *{flex:none}
  .top.game{position:sticky; top:0; z-index:5; background:rgba(5,7,11,.94); backdrop-filter:blur(10px)}
  .top.game{display:grid; grid-template-columns:auto 1fr auto; grid-template-areas:"round pill gt" "spk extra tools";
    column-gap:12px; row-gap:10px; align-items:center}
  .top.game .round{grid-area:round}
  .top.game .phase-pill{grid-area:pill; justify-self:center}
  .top.game .gt{grid-area:gt}
  .top.game .chips{grid-area:spk; justify-self:start}
  .top.game .extra{grid-area:extra; justify-self:end}
  .home-grid, .claim-grid{grid-template-columns:1fr}
  .lay > .open-wait{flex:1 0 auto}
  .top.game .tools{grid-area:tools; gap:8px}
  .top.game .spacer{display:none}
  .content, .body, .scroll{overflow:visible; min-height:auto}
  .body{grid-template-columns:1fr; padding:14px 16px 18px}
  .split{grid-template-columns:minmax(0,1fr)}
  .grow{flex:none}
  .hero{min-height:auto}
  .hero .bigclock{margin:20px 0 0; font-size:clamp(84px, 26cqw, 186px)}
  .rail, .rail-b{overflow:visible; min-height:auto}
  .rail-b{flex:none}
  .rw{inset:calc(var(--top-h, 135px) + 12px) 24px 20px}
  .rw-f .ibtn, .rw-f .big{white-space:nowrap; flex:none}
  .rw-f .note{min-width:0; overflow-wrap:anywhere}
  .rw-spk{flex-wrap:wrap; gap:10px}
  .rw-spk .l{flex-basis:100%; width:auto}
  .rw-spk .opts{flex-wrap:wrap}
  .spkopt{flex:1 1 110px}
  .cards{grid-template-columns:repeat(auto-fill, minmax(170px, 1fr))}
  .card{min-height:112px}
  .stat-grid, .stat-grid.five{grid-template-columns:repeat(auto-fit, minmax(150px, 1fr))}
  .setup-grid{grid-template-columns:1fr; height:auto}
  .status .side, .agenda .col{display:contents}
  .status .timer{order:-1}
  .agenda .ag-card{order:-3}
  .agenda .ag-disc{order:-2}
  .agenda .ag-now{order:-1}
  .agenda .ag-tally{order:1}
  .agenda .ag-resolve{order:2}
  .join-grid{grid-template-columns:1fr; padding:0 24px; gap:24px}
}

/* ─────────── a short window, such as a phone held sideways or a small laptop ─────────── */
@container app (max-height: 700px){
  .lay{overflow-y:auto; scrollbar-width:none}
  .lay > *{flex:none}
  .content, .body, .scroll{overflow:visible; min-height:auto}
  .hero{min-height:auto}
  .hero .bigclock{margin-top:20px; font-size:clamp(64px, min(24cqh, 26cqw), 186px)}
  .top.game{position:sticky; top:0; z-index:5; background:rgba(5,7,11,.94); backdrop-filter:blur(10px)}
}
/* A phone held sideways: the fields get 16 px text, as on an upright phone. */
@container app (max-height: 500px){
  .fld, .fld.sel{font-size:16px}
}

/* ─────────── the compact game top bar: up to 740 px wide, and on a phone held sideways ─────────── */
/* Two lines and a thin phase line, so the bar never wraps its buttons, and a short screen keeps room for the clock. */
@container app (max-width: 740px) or ((max-width: 900px) and (max-height: 500px)){
  .top.game{grid-template-columns:1fr auto; grid-template-areas:"round gt" "spk tools" "extra extra" "pill pill";
    column-gap:8px; row-gap:0; padding:10px 16px 0; border-bottom:none}
  .top.game .round{font-size:11px}
  .top.game .ibtn{padding:9px 12px}
  .top.game .ibtn .word{display:none}
  .top.game .chips, .top.game .tools, .top.game .extra, .top.game .phase-pill{margin-top:10px}
  .top.game .chips{gap:8px}
  .top.game .ph-now{display:inline}
  .top.game .gt{font-size:10.5px}
  .top.game .gt b{font-size:15px; margin-left:6px}
  .top.game .tools .ibtn{min-width:40px; justify-content:center}
  .top.game .extra{justify-self:start}
  .top.game .phase-pill{justify-self:stretch; display:grid; grid-template-columns:repeat(4,1fr); gap:3px; margin:10px -16px 0;
    padding:0; border:none; border-radius:0; background:none}
  .top.game .phase-pill span{height:3px; padding:0; border-radius:0; font-size:0; background:#17212c}
  .top.game .phase-pill span.done{background:#255450}
  .top.game .phase-pill span.on{background:var(--accent)}
}

/* ─────────── a phone ─────────── */
@container app (max-width: 600px){
  /* iPhone Safari zooms in on a field with text under 16 px, and it does not zoom back out. */
  .fld, .fld.sel{font-size:16px}
  .top{flex-wrap:wrap; gap:8px; row-gap:10px; padding:10px 16px 12px}
  .top .round{font-size:11px}
  .top.stack .round{flex-basis:100%}
  .top .ibtn{padding:9px 12px}
  .ibtn .word{display:none}
  .content{padding:14px 16px}
  .body{padding:12px 16px 16px}
  .split, .col{gap:12px}
  .foot{flex-wrap:wrap; gap:10px; padding:0 16px 16px}
  .foot .ibtn{flex:1; justify-content:center; padding:13px 12px}
  .foot .big{flex-basis:100%; font-size:20px; padding:18px 14px}
  .big.lg, .big.md{font-size:22px; padding:19px}
  .h1{font-size:25px}
  .h1s{font-size:12.5px; line-height:1.5; margin-top:5px}
  .pnl-h{padding:12px 14px; flex-wrap:wrap; gap:4px 12px}
  .pnl-note{white-space:nowrap}

  /* action phase: the hero keeps End Turn under the clock, and the rail rows become tiles */
  .hero{padding:14px 16px 16px}
  .hero-top{gap:12px}
  .hero .dot{width:14px; height:14px; margin-top:8px; box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 22%, transparent)}
  .hero h3{font-size:28px}
  .hero .fac{font-size:12.5px; margin-top:3px}
  .hero .init .n{font-size:34px}
  .hero .init .l{font-size:9px; letter-spacing:.14em}
  .hero .bigclock{margin-top:16px}
  .hero .clock-sub{font-size:12px; letter-spacing:.03em; margin-top:6px}
  .hero .limitbar{height:6px; margin-top:14px}
  .hero .limitrow{font-size:10px}
  .hero .alarm{padding:9px 10px 9px 12px; margin-bottom:12px; gap:10px}
  .hero .alarm .s{font-size:11.5px}
  .hero .acts{gap:10px; margin-top:16px}
  .acts.two{display:flex; flex-wrap:wrap}
  .acts.two .big{flex-basis:100%}
  .acts.two .sec{flex:1 1 0}
  .hero .big{font-size:24px; padding:21px 16px}
  .hero .sec{padding:12px 14px; font-size:14.5px}
  .rail{background:none; border:none; border-radius:0}
  .rail-h{padding:0 2px 9px; border:none}
  .rail-b{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:0}
  .rail .row{grid-template-columns:auto 1fr; grid-template-areas:"in nm" "fc fc" "tm tm"; gap:3px 6px; align-items:baseline;
    min-width:0; margin:0; padding:8px 9px 7px; border:1px solid var(--line); background:#0a0f16}
  .rail .row .who{display:contents}
  .rail .row .in{grid-area:in; font-size:18px; text-align:left}
  .rail .row .nm{grid-area:nm; font-size:14px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block}
  .rail .row .nm i{display:none}
  .rail .row .fc{grid-area:fc; display:flex; flex-direction:column; align-items:flex-start; gap:3px; min-width:0; margin:0}
  .rail .row .sccard{margin:0; padding:1px 6px; font-size:10.5px; letter-spacing:0; text-transform:none}
  .rail .row .fn{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rail .row .tm{grid-area:tm; display:flex; flex-wrap:wrap; column-gap:6px; align-items:baseline; text-align:left}
  .rail .row .tm .a{font-size:13px}
  .rail .row .tm .b{font-size:10.5px; margin:0}
  .rail .row.active{background:color-mix(in srgb,var(--pc) 14%, #0b111a); border-color:color-mix(in srgb,var(--pc) 55%, transparent); box-shadow:none}
  .rail .row .chip{top:-7px; right:7px}
  .rail-f{padding:10px 2px 0; border:none; justify-content:flex-start; gap:14px}

  /* reaction window: a sheet under the top bar, one row per reacting player */
  .rw{inset:var(--top-h, 147px) 0 0; border-bottom:none; border-radius:22px 22px 0 0;
    padding:18px 16px 14px}
  .rw-h{display:block}
  .rw-h h3{font-size:25px; margin-top:4px}
  .rw-h .by{font-size:13px}
  .rw-clock{margin:12px 0 0; text-align:center}
  .rw-clock .t{font-size:68px}
  .rw-bar{margin:12px 0 10px}
  .rw-spk{gap:8px; padding:10px 12px; margin-bottom:10px}
  .rw-spk .opts{gap:6px}
  .spkopt{flex:1 1 30%; padding:10px 6px}
  .tiles{grid-template-columns:1fr; gap:7px; overflow-y:auto; align-content:start; scrollbar-width:none}
  .rw .tiles{flex:1 1 0; min-height:120px}
  .tile{display:grid; grid-template-columns:1fr auto; column-gap:12px; align-items:center; min-height:54px; padding:8px 9px 8px 14px}
  .tile .nm{grid-row:1; grid-column:1; font-size:16px}
  .tile .fc{grid-row:2; grid-column:1; margin-top:2px}
  .tile .st{grid-row:1; grid-column:2; margin:0; text-align:right; font-size:12.5px}
  .tile .took{grid-row:2; grid-column:2; margin:2px 0 0; text-align:right}
  .tile .tapme{grid-row:1 / span 2; grid-column:2; margin:0; padding:12px 14px; font-size:13.5px}
  .tile .pchip{position:static; grid-row:1; grid-column:1; justify-self:end}
  .tile.tile-idle{display:flex; min-height:38px; font-size:12px}
  .tile.tile-idle br{display:none}
  .rw-f{flex-wrap:wrap; gap:10px; margin-top:12px}
  .rw-f .note{flex-basis:100%}
  .rw-f .spacer{display:none}
  .rw-f .ibtn{flex:1; justify-content:center; padding:12px}
  .rw-f .big{flex-basis:100%; font-size:22px; padding:19px}

  /* strategy phase */
  .picker{display:grid; grid-template-columns:1fr auto; grid-template-areas:"who t" "help help" "spk spk"; gap:8px 12px; padding:12px 14px}
  .picker .who-box{grid-area:who}
  .picker .who{font-size:20px; margin-top:3px}
  .picker .t{grid-area:t; font-size:34px}
  .picker .picker-help{grid-area:help; margin:0; max-width:none}
  .picker .spkb{grid-area:spk; justify-self:start; margin:0; padding:9px 12px}
  .cards{grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px}
  .card{display:grid; grid-template-columns:34px 1fr; column-gap:8px; min-height:0; padding:11px 12px}
  .card .n{font-size:28px; grid-row:span 2}
  .card .nm{font-size:14.5px; margin-top:1px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .card .own, .card .free{margin-top:4px; font-size:12.5px}
  .card .tg{top:-8px; right:10px; font-size:10px; padding:2px 7px}
  .order-strip{gap:6px}
  .order-strip .lbl{flex-basis:100%}
  .oc{font-size:12.5px; padding:4px 10px 4px 7px}

  /* status and agenda phases */
  .tabletimer{padding:16px 0 14px}
  .tabletimer .t{font-size:72px}
  .tabletimer .t.md{font-size:52px}
  .steps{gap:7px}
  .step{display:grid; grid-template-columns:26px 1fr; gap:0 12px; padding:10px 13px}
  .step .bx{grid-row:span 2}
  .step .lb{font-size:14.5px}
  .step .no{margin:2px 0 0; font-size:11.5px}
  .custodians{padding:13px 14px}
  .agenda-card{padding:13px 15px; margin-bottom:0}
  .agenda-card h4{font-size:20px}
  .agenda-card p{font-size:12.5px}
  .voter-now{padding:14px; gap:10px}
  .voter-now .t{font-size:48px}
  .vote-row{grid-template-columns:24px 1fr 80px 50px; gap:9px; padding:10px 11px; margin-bottom:6px}
  .vote-row .nm{font-size:15px}
  .vote-row .vt{font-size:14.5px}
  .vote-row .badge{font-size:10px; padding:5px 4px}

  /* round summary and post-game stats */
  .stat-grid, .stat-grid.five{grid-template-columns:1fr 1fr; gap:9px}
  .stat{padding:12px 13px}
  .stat .l{font-size:9.5px; letter-spacing:.12em}
  .stat .v{font-size:24px; margin-top:5px}
  .stat .s{font-size:11px}
  .bars{gap:11px}
  .bar-row{grid-template-columns:78px 1fr 52px; gap:9px}
  .bar-row .nm{font-size:13.5px; gap:7px}
  .bar-row .vl{font-size:13.5px}
  .track{height:18px}
  .legend{gap:12px; margin-top:14px; font-size:11px}
  .tbl thead{display:none}
  .tbl tr{display:grid; grid-template-columns:repeat(3,1fr); gap:6px 10px; padding:10px 0; border-top:1px solid var(--line)}
  .tbl td{padding:0; border:none}
  .tbl td:first-child{grid-column:1 / -1}
  .tbl td[data-l]::before{content:attr(data-l); display:block; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--faint); margin-bottom:2px}

  /* setup and settings */
  .count{gap:6px}
  .count b{padding:10px 0}
  /* a phone: each seat row is a card with its own grid, so the list has one column */
  .seat-list{grid-template-columns:minmax(0,1fr)}
  .seat-list .seat{grid-template-columns:24px 1fr 1fr 34px; grid-template-areas:"mv sw sw spk" "sn name fac fac"; gap:9px 7px;
    padding:10px 10px 10px 8px}
  .seat .seat-move{grid-area:mv}
  .seat .sn{grid-area:sn}
  .seat .swatches{grid-area:sw; gap:5px; flex-wrap:nowrap}
  .seat .sw{width:26px; height:26px; border-radius:7px}
  .seat .name{grid-area:name}
  .seat .fac{grid-area:fac}
  .seat .spk{grid-area:spk; width:34px; height:34px}
  .seat .fld{min-width:0; padding:9px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .master{padding:14px 15px; gap:12px; margin-bottom:14px}
  .set-row{grid-template-columns:1fr auto; grid-template-areas:"lb tog" "ds ctl"; gap:6px 12px; padding:12px 14px}
  .set-row .txt{display:contents}
  .set-row .lb{grid-area:lb}
  .set-row .ds{grid-area:ds; margin:0}
  .set-row .tog{grid-area:tog}
  .set-row .ctl{grid-area:ctl; align-self:center}
  .set-row .stepper{width:128px}

  /* speaker and seating */
  .ringwrap .seatnode{width:min(84px, 21cqw); padding:13px 5px 7px}
  .ringwrap .seatnode i{width:11px; height:11px}
  .ringwrap .seatnode .nm{font-size:13.5px; margin-top:4px}
  .ringwrap .seatnode .sn2{font-size:9.5px}
  .ringwrap .cc{width:36%}
  .ringwrap .cc .v{font-size:17px}
  .ringwrap .cc .s{font-size:10.5px; margin-top:6px}
  .ringwrap .cc br{display:none}
  .seat-orders{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:9px}
  .seat-orders > .ibtn, .seat-orders > .order-help{grid-column:1 / -1}
  .seat-orders .pnl-h{padding:10px 11px; font-size:10px; letter-spacing:.12em}
  .ord-body{padding:8px}
  .ordrow{grid-template-columns:14px 1fr auto; gap:6px; padding:6px 8px; font-size:13px}
  .ordrow .tag2{padding:2px 5px; font-size:8.5px}

  /* history */
  .top .phase-pill{order:5; flex-basis:100%; justify-content:space-between}
  .undo-bar{flex-wrap:wrap; gap:12px; padding:14px}
  .undo-bar .big{flex-basis:100%; font-size:20px !important; padding:16px !important}
  .ev{grid-template-columns:30px 1fr; gap:4px 10px; padding:11px 12px}
  .ev .ico{width:30px; height:30px; font-size:13px}
  .ev .t{font-size:14px}
  .ev .d{font-size:12px; flex-wrap:wrap; gap:6px}
  .ev .evr{grid-column:1 / -1; justify-content:flex-end; flex-wrap:wrap; gap:6px}
  .ev .hchip{left:12px}

  /* join */
  .qr{width:206px; height:206px; padding:12px}
  .joincode{font-size:44px}
  .joinlink{font-size:14px}
  .dev-row{gap:9px; padding:11px 12px}
  .dev-row .adm{min-width:0}
  /* home: the code above the summary, and the button beside both */
  .recent{grid-template-columns:1fr auto; gap:3px 12px}
  .recent .code{grid-column:1}
  .recent .ibtn{grid-row:1 / span 2; grid-column:2; align-self:center}
  .foot .lobby-help{flex-basis:100%; text-align:center}

  /* dialogs open as a sheet at the bottom, and the pause overlay keeps Resume full width */
  .overlay.ask{place-items:end stretch}
  .overlay.ask > *{margin:auto 0 0}
  .dialog{width:auto; padding:22px}
  .dialog h3{font-size:22px}
  .dialog .btns{flex-direction:column-reverse; gap:10px}
  .dialog .btns > *{justify-content:center; text-align:center}
  /* Cancel goes under the big button, so the big button keeps the full gap under its 8 px edge, as End Turn does. */
  .dialog .big{font-size:20px; padding:18px; margin-bottom:8px}
  .dialog .ibtn{padding:14px}
  .pause-card{width:100%; padding:0 16px}
  .reasons{width:auto}
  .pause-card .t{font-size:96px}
  .pause-card .big{width:100%; font-size:22px; padding:19px}
}

/* ─────────── device switch in the stage header ─────────── */
.devs{margin-left:auto; align-self:center; display:flex; gap:3px; background:#0a0e14; border:1px solid var(--line); border-radius:9px; padding:3px}
.devs button{font-family:var(--f); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint);
  background:none; border:none; padding:5px 12px; border-radius:6px; cursor:pointer}
.devs button.on{background:var(--accent); color:#04211f; font-weight:700}
.devs button:disabled{opacity:.3; cursor:default}
.stage-head .tag.later-scr{color:#a9b8c9; border-color:#2a3849; background:#141b24}
</style>

<body>

<div class="app">
  <aside class="nav">
    <h1>TI4 Nexus</h1>
    <div class="sub">Screen mockups · Twilight Imperium 4th Ed.</div>
    <div id="navlist"></div>
