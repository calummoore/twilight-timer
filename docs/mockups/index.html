      <kbd>←</kbd> <kbd>→</kbd> to step through screens.<br>
      <kbd>↑</kbd> <kbd>↓</kbd> to switch the device frame.<br>
      Timers on the action &amp; reaction screens run live.
    </div>
  </aside>

  <main class="stage">
    <div class="stage-head">
      <h2 id="stitle">—</h2>
      <span class="tag" id="stag">iPad</span>
      <span class="tag later-scr" id="slater" hidden>Later</span>
      <div class="devs" id="devs"><button data-d="ipad">iPad</button><button data-d="tablet">iPad upright</button><button data-d="phone">Phone</button></div>
    </div>
    <div class="stage-body">
      <div class="frame-wrap" id="wrap">
        <div class="frame ipad" id="frame"></div>
      </div>
    </div>
    <div class="stage-note" id="snote"></div>
  </main>
</div>

<script>
/* ══════════════════ demo data ══════════════════ */
const P = {
  jaz  :{name:'Jaz',   c:'blue',   f:'Federation of Sol',  seat:1, speaker:true},
  kira :{name:'Kira',  c:'red',    f:'Embers of Muaat',    seat:2},
  tom  :{name:'Tom',   c:'green',  f:'Arborec',            seat:3},
  priya:{name:'Priya', c:'yellow', f:'Emirates of Hacan',  seat:4},
  sam  :{name:'Sam',   c:'purple', f:'Naalu Collective',   seat:5},
  wren :{name:'Wren',  c:'orange', f:'Argent Flight',      seat:6},
};
const col = id => `--pc:var(--c-${P[id].c})`;
const COLOURS = ['red','blue','green','yellow','purple','orange','pink','black'];

// Mid strategy phase. Picks go in speaker order: Jaz, Kira, Tom and Priya have picked, Sam picks now, Wren picks last.
const CARDS = [
  {n:1, nm:'Leadership',   o:'tom'},   {n:2, nm:'Diplomacy',   o:null},
  {n:3, nm:'Politics',     o:'jaz'},   {n:4, nm:'Construction',o:null},
  {n:5, nm:'Trade',        o:'kira'},  {n:6, nm:'Warfare',     o:null, tg:true},
  {n:7, nm:'Technology',   o:'priya'}, {n:8, nm:'Imperial',    o:null, tg:true},
];

// Round 3 action phase — initiative order derived from card numbers.
// Sam plays the Naalu, so the "0" token puts Sam first with card 4.
const ORDER = [
  {id:'sam',   init:0, card:4, state:'wait',   sc:false, total:775,  turns:3},
  {id:'tom',   init:1, card:1, state:'passed', sc:true,  total:1122, turns:4},
  {id:'wren',  init:2, card:2, state:'passed', sc:true,  total:903,  turns:4},
  {id:'jaz',   init:3, card:3, state:'wait',   sc:true,  total:1277, turns:3},
  {id:'kira',  init:5, card:5, state:'active', sc:false, total:1050, turns:3},
  {id:'priya', init:7, card:7, state:'wait',   sc:true,  total:1448, turns:3},
];

// A four-player game: Jaz, Kira, Tom and Priya pick two cards each.
// Mid-strategy-phase, second round: Jaz took Imperial, Kira picks now.
const CARDS4 = [
  {n:1, nm:'Leadership',   o:'tom'},   {n:2, nm:'Diplomacy',   o:'priya'},
  {n:3, nm:'Politics',     o:'jaz'},   {n:4, nm:'Construction',o:null},
  {n:5, nm:'Trade',        o:'kira'},  {n:6, nm:'Warfare',     o:null},
  {n:7, nm:'Technology',   o:null},    {n:8, nm:'Imperial',    o:'jaz'},
];
// Its action phase: the lower card is the initiative, one turn per cycle.
const ORDER4 = [
  {id:'tom',   init:1, cards:[[1,true],[7,true]],  state:'passed', total:1022, turns:4},
  {id:'priya', init:2, cards:[[2,true],[4,false]], state:'wait',   total:1310, turns:3},
  {id:'jaz',   init:3, cards:[[3,true],[8,true]],  state:'wait',   total:1188, turns:3},
  {id:'kira',  init:5, cards:[[5,true],[6,false]], state:'active', total:950,  turns:3},
];

const fmt = s => { s=Math.max(0,Math.round(s));
  const m=Math.floor(s/60), ss=String(s%60).padStart(2,'0');
  return m>=60 ? `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}:${ss}` : `${m}:${ss}`; };
const fmtL = s => { const m=Math.floor(s/60); return `${m}:${String(Math.round(s)%60).padStart(2,'0')}`; };

/* ══════════════════ fragments ══════════════════ */
const CARDNAME = {1:'Leadership',2:'Diplomacy',3:'Politics',4:'Construction',
                  5:'Trade',6:'Warfare',7:'Technology',8:'Imperial'};
// Marks a control that is designed but not in the app yet.
const LATER = '<span class="later-tag">Later</span>';
// Removes the live clocks of a screen behind an overlay. A pause stops them all, but a rule check keeps the game clock running.
const still = h => h.replace(/ data-clock="[^"]*"/g,'');

const sccard = (n, used) =>
  `<span class="sccard ${used?'used':''}">${used?'✓ ':''}${CARDNAME[n]}</span>`;
const railRow = p => {
  const d=P[p.id], live = p.state==='active';
  const cards = p.cards ? p.cards.map(([n,used])=>sccard(n,used)).join('') : sccard(p.card, p.sc);
  const chip = live ? '<b class="chip now">Turn</b>'
             : p.state==='passed' ? '<b class="chip pass">Passed</b>' : '';
  return `<div class="row ${p.state}" style="${col(p.id)}">
    ${chip}
    <div class="in num">${p.init}</div>
    <div class="who"><div class="nm"><i></i>${d.name}</div>
      <div class="fc">${cards}<span class="fn">${d.f}</span></div></div>
    <div class="tm">
      <div class="a num">${fmt(p.total)}</div>
      <div class="b num">${live?'this turn 1:47':`${p.turns} ${p.turns===1?'turn':'turns'}`}</div>
    </div></div>`;
};

/* solid gear with eight teeth and a round hole, in a 24x24 box */
const GEAR = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M9.9 4L10.1 1.2L13.9 1.2L14.1 4L16.2 4.8L18.3 3L21 5.7L19.2 7.8L20 9.9L22.8 10.1L22.8 13.9L20 14.1L19.2 16.2L21 18.3L18.3 21L16.2 19.2L14.1 20L13.9 22.8L10.1 22.8L9.9 20L7.8 19.2L5.7 21L3 18.3L4.8 16.2L4 14.1L1.2 13.9L1.2 10.1L4 9.9L4.8 7.8L3 5.7L5.7 3L7.8 4.8ZM15.3 12a3.3 3.3 0 1 0 -6.6 0a3.3 3.3 0 1 0 6.6 0Z"/></svg>`;

// The game on the server, and the devices in it. Kira set the game up on Kira's phone and took Kira's seat, so that
// phone has a seat and admin. The iPad in the middle of the table joined as a table device, and Kira's phone gave it
// admin. Jaz's phone has a seat and no admin, so it waits while Kira plays. Tom's phone holds a seat but is away.
// Priya's phone has a seat and no admin. A laptop joined as a table device and is a viewer until an admin gives it
// admin.
const CODE = '7QK2HN', LINK = 'ti4.nexus/join/7QK2HN';
const TABLE  = {seat:null,  admin:true};
const SEATED = {seat:'jaz', admin:false};
const VIEWER = {seat:null,  admin:false};
const MEMBERS = [
  {seat:null,    admin:true,  on:true, me:true},
  {seat:'kira',  admin:true,  on:true},
  {seat:'jaz',   admin:false, on:true},
  {seat:'tom',   admin:false, on:false},
  {seat:'priya', admin:false, on:true},
  {seat:null,    admin:false, on:true},
];
// The chip that opens Players & devices: the seat of this device, Table, or Viewer.
const youChip = me => me.seat
  ? `<button class="ibtn youb" style="${col(me.seat)}"><i></i><span class="word">You: </span>${P[me.seat].name}</button>`
  : me.admin
    ? `<button class="ibtn youb table"><i></i>Table<span class="word"> device</span></button>`
    : `<button class="ibtn youb"><i></i>Viewer</button>`;

const PHASES = [['str','Strategy'],['act','Action'],['sta','Status'],['age','Agenda']];
// `me` is the device that shows the screen. Undo and Pause need admin.
const topBar = (phase, extra='', me=TABLE) => {
  const at = phase==='sum' ? PHASES.length : PHASES.findIndex(p=>p[0]===phase);
  const name = phase==='sum' ? 'Summary' : PHASES[at][1];
  const adm = me.admin ? '' : ' disabled';
  return `
  <div class="top game">
    <div class="round">Round <b>3</b><span class="ph-now"> · <b>${name}</b></span></div>
    <div class="phase-pill">${PHASES.map(([,label],i)=>
      `<span class="${i===at?'on':i<at?'done':''}">${label}</span>`).join('')}</div>
    <div class="chips"><button class="ibtn spkb">★<span class="word"> Speaker:</span> Jaz</button>${youChip(me)}</div>
    <div class="spacer"></div>
    ${extra}
    <div class="gt">Game <b class="num" data-clock="up" data-t="9847">2:44:07</b></div>
    <div class="tools"><button class="ibtn"${adm}>↺ Undo</button><button class="ibtn"${adm}>⏸<span class="word"> Pause</span></button>
      <button class="ibtn icon" aria-label="Settings">${GEAR}</button></div>
  </div>`;
};

/* ══════════════════ screens ══════════════════ */
// Each screen has one template. The iPad frame draws it at 1194 × 834; the narrow frames draw the same
// template, and the container queries in the styles arrange it. `note` explains the iPad layout, `mnote` the narrow one.
const S = {};

/* ── 1. Setup ── */
// empty: the seats with no faction yet. While a seat has none, CREATE GAME is off,
// and the random deal can fill the empty seats.
// sets: the expansions that are on. The base game is always in play.
// limits: the time limits are on. The panel summary scrolls when it is full.
const EXPANSIONS = [['pok','Prophecy of Kings'], ['te',"Thunder's Edge"], ['keleres','Council Keleres']];
const ALL_SETS = EXPANSIONS.map(([k])=>k);
// failed: Create game did not reach the server.
const setupScreen = (empty=[], sets=ALL_SETS, limits=true, failed=false) => { const missing = empty.length>0; return `<div class="space"></div><div class="lay">
  <div class="top"><div class="round"><b>New Game</b></div><div class="spacer"></div>
    <button class="ibtn">✕ Back</button><button class="ibtn">⚙<span class="word"> Settings</span></button></div>
  <div class="content"><div class="setup-grid">
    <div class="col">
      <div>
        <div class="setup-label">Players · in seat order, clockwise around the table</div>
        <div class="count">${[3,4,5,6,7,8].map(n=>`<b class="${n===6?'on':''}">${n}</b>`).join('')}</div>
      </div>
      <div class="seat-list scroll grow">
      ${Object.entries(P).map(([id,d])=>{
        const none = empty.includes(id);
        return `
        <div class="seat ${d.speaker?'sp':''}" style="${col(id)}">
          <div class="seat-move"><b class="${d.seat===1?'off':''}">▲</b><b class="${d.seat===6?'off':''}">▼</b></div>
          <div class="sn">Seat<br>${d.seat}</div>
          <div class="swatches">${COLOURS.map(c=>
            `<div class="sw ${c===d.c?'on':''}" style="--pc:var(--c-${c})"></div>`).join('')}</div>
          <div class="fld name">${d.name}</div>
          <div class="fld sel fac ${none?'none':''}">${none?'Faction':d.f}</div>
          <div class="spk ${d.speaker?'on':''}">★</div>
        </div>`}).join('')}
      </div>
    </div>
    <div class="pnl" style="display:flex;flex-direction:column;min-height:0">
      <div class="pnl-h">Game</div>
      <div class="grow scroll" style="padding:16px 18px">
        <div class="kv"><span>Players</span><b>6</b></div>
        <div class="kv"><span>Strategy cards each</span><b>1</b></div>
        <div class="kv"><span>Speaker</span><b>Jaz</b></div>
        ${empty.includes('sam')?'':'<div class="kv"><span>Naalu 0 token</span><b>Sam</b></div>'}
        ${limits?`<div class="kv"><span>Time limits</span><b style="color:var(--warn)">Enabled</b></div>
        <div class="kv"><span>Turn limit</span><b>3:00</b></div>
        <div class="kv" style="border:none"><span>Reaction window</span><b>2:00</b></div>`
        :'<div class="kv"><span>Time limits</span><b>Off</b></div>'}
        <div class="setup-help">Seat order is the physical ring. The <b>speaker ★</b> picks first in the strategy phase and votes
          last in the agenda phase.</div>
      </div>
      <div style="padding:16px 18px">
        <div class="exps"><div class="lbl">Expansions</div><div class="exp-row">
          ${EXPANSIONS.map(([k,n])=>`<button class="exp ${sets.includes(k)?'on':''}">${n}</button>`).join('')}
        </div></div>
        ${missing?'<div class="setup-need">Pick a faction for every seat to create the game.</div><button class="deal">Random factions for empty seats</button>':''}
        ${failed?'<div class="setup-need">The game could not be created. Check the connection and try again.</div>':''}
        <button class="big lg" style="width:100%" ${missing?'disabled':''}>CREATE GAME</button>
      </div>
    </div>
  </div></div></div>`; };

S.setup = {t:'Setup — New Game', note:
 `Seat order matters: it drives <b>speaker order</b> in the strategy phase and <b>clockwise voting order</b> in the agenda phase, both of which are independent of initiative order. Colour is the primary identifier everywhere else in the app, so it's picked as swatches rather than buried in a dropdown. The speaker token is set here. Later it moves only when someone moves it: from the speaker chip, or in the reaction window when Politics (3) is played. Each seat picks its faction from the official factions of the base game and the chosen expansions, and taking a faction another seat holds swaps the two, as colours do. Because the app knows each faction, it knows the Naalu player: the Game panel shows who holds the <b>Naalu "0" token</b>, which puts that player first in each action phase, unless Gift of Prescience moves it for one round. Only at 3 or 4 players, a second line under the summary says that each player picks <b>two</b> strategy cards, and that the lower card sets their place in the turn order. The <b>Expansions</b> chips say what the table plays with besides the base game. They start all on, and the iPad keeps the choice for the next game. <b>Create game</b> then puts the seats on the server and opens the claim screen, where this device takes a seat or joins as the table device, as the first admin. Then the lobby opens, where the phones join before the host starts the game. Elsewhere, dashed and dimmed controls marked <b>Later</b> are designed but not in the app yet.`,
 mnote:
 `On a narrow screen, the Game panel moves under the seats, and the screen scrolls. On a phone, each seat row becomes a card: the arrows and the seat number on the left, the swatches and the speaker ★ on top, and the name and faction fields under them. Every control of the iPad row is still there.`,
 h:setupScreen()};

S.setupFailed = {t:'Setup — Create Failed', note:
 `Create game puts the seats on the server, so it needs a connection. While the request runs, the button reads CREATING and waits. When the server cannot be reached, the line above the button says so, and the seats stay as they are, so one more tap tries again. <b>Back</b> goes to Home and drops the seats.`,
 mnote:
 `The line sits above CREATE GAME, at the end of the Game panel.`,
 h:setupScreen([], ALL_SETS, true, true)};

S.setupMissing = {t:'Setup — Faction Missing', note:
 `Every seat needs a faction before the game begins, because a rule can depend on it: a forgotten Naalu faction would put the Naalu player in card order for the whole game. The empty choice is only a placeholder, so <b>CREATE GAME stays off</b> until every seat has a faction. Here Wren has not picked one yet. <b>Random factions for empty seats</b> gives Wren a faction from the base game or the chosen expansions that no other seat holds. The other five seats keep their picks.`,
 mnote:
 `The same check in the narrow layout. The message and the deal button sit above CREATE GAME, at the end of the Game panel.`,
 h:setupScreen(['wren'])};

S.setupDeal = {t:'Setup — Random Factions', note:
 `A new setup, before any seat has a faction. This table plays with the base game and Prophecy of Kings, so <b>Thunder's Edge</b> and <b>Council Keleres</b> are off. Every faction list then offers only the 24 factions of those two boxes, and so does the deal. The time limits show their default, off. <b>Random factions for empty seats</b> gives each empty seat a different faction, and CREATE GAME turns on. The button shows only while a seat has no faction, so it never replaces a faction that a player picked. A seat keeps its faction when its expansion turns off.`,
 mnote:
 `The same setup in the narrow layout. The deal button sits above CREATE GAME. On a phone, the expansion chips wrap.`,
 h:setupScreen(Object.keys(P), ['pok'], false)};

/* ── 2. Settings ── */
const setRow = (lb,ds,ctl,tog,cls='') => `<div class="set-row ${cls}">
  <div class="txt"><div class="lb">${lb}</div><div class="ds">${ds}</div></div>
  <div class="ctl">${ctl}</div>${tog}</div>`;
const tog = on => `<div class="tog ${on?'on':''}"></div>`;
const step = v => `<div class="stepper"><i>−</i><b class="num">${v}</b><i>+</i></div>`;
const TIMERS = [
  ['Turn limit','A single player turn in the action phase.','3:00',true],
  ['Reaction window','Secondary abilities after a strategy card is played. Charged to nobody.','2:00',true],
  ['Agenda discussion','Per agenda, before voting opens.','4:00',true],
  ['Vote','Per player, from the speaker’s left.','1:00',true],
  ['Status phase','Whole table, across all seven steps.','5:00',false],
  ['Strategy pick','Per player, choosing a card.','0:45',true],
];

S.settings = {t:'Settings — Game and This Device', note:
 `Limits ship <b>off</b> — tracking is the product, enforcement is opt-in. Each timer is independently switchable so a group can, say, cap the agenda phase (the usual offender) while leaving turns unlimited. Expiry is always soft: red, alarm, and the clock keeps counting <b>upward into overtime</b>, which is logged separately and shows up in the post-game stats. The app never ends a turn on its own. <b>End game</b> shows when settings open during a game. The settings sit in two groups. The <b>Game</b> group belongs to the game: every device follows it, and only an admin device changes it, so a seated device without admin sees it dimmed, with End game. The <b>This device</b> group stays on the device: the alarm, the screen, and the rail.`,
 mnote:
 `The same rows in one column. On a phone, each row puts its switch next to its name, and its stepper or sound menu under the description.`,
 h:settingsScreen()};

S.settingsNew = {t:'Settings — Before a Game', note:
 `Settings from Home or from the setup, before the game exists. The time limits are the ones that the next game starts with, and this device keeps them for its next setup. The game then keeps its own limits, which an admin device changes. There is no game to end yet.`,
 mnote:
 `The same rows in one column, as in a game.`,
 h:settingsScreen(false)};

// `game`: the settings open in a game, so the time limits are the game's own. Before a game, they are the limits that
// the next game starts with.
function settingsScreen(game=true){ return `<div class="space"></div><div class="lay">
  <div class="top"><div class="round"><b>Settings</b></div><div class="spacer"></div>
    ${game?'<button class="ibtn warnish">End game</button>':''}<button class="ibtn">✕ Close</button></div>
  <div class="content">
    <div class="setup-label">${game?'Game · every device follows these':'New game · the limits it starts with'}</div>
    <div class="master"><div style="flex:1"><div class="lb">Enforce time limits</div>
      <div class="ds">Off is pure tracking. Clocks still run and every turn is recorded.</div></div>
      ${tog(true)}</div>
    <div class="pnl">
      <div class="pnl-h">Timers</div>
      ${TIMERS.map(([lb,ds,v,on])=>setRow(lb,ds,step(v),tog(on),on?'':'off')).join('')}
    </div>
    <div class="pnl" style="margin-top:16px">
      <div class="pnl-h">When time is up</div>
      ${setRow(`Count overtime${LATER}`,'Clock flips to counting up. Overage is logged per turn and totalled per player.',
        '<div style="font-size:12px;color:var(--faint);text-align:center">Always on</div>',
        '<div class="tog on" style="opacity:.4"></div>','later')}
      ${setRow(`Auto-advance turn${LATER}`,'End the turn automatically when the limit is hit. Off by design — the app is not a referee.',
        '',tog(false),'later')}
    </div>
    <div class="setup-label" style="margin-top:26px">This device</div>
    <div class="pnl">
      <div class="pnl-h">Alarm</div>
      ${setRow('Alarm sound','Sounds on this device when a limit passes. The clock turns red and counts overtime. Nothing ends on its own.',
        `<div style="display:flex;gap:8px"><div class="fld sel" style="flex:1">Klaxon ▾</div><button class="mini">Play</button></div>`,tog(true))}
    </div>
    <div class="pnl" style="margin-top:16px">
      <div class="pnl-h">Display</div>
      ${setRow('Keep screen awake','Stops the screen sleeping mid-game.','',tog(true))}
      ${setRow('Show game time on the rail','Off shows only the current turn, which some groups find less competitive.','',tog(true))}
    </div>
  </div></div>`; }

/* ── 3. Speaker & seating ── */
// physical seating ring, clockwise. Speaker is a pointer into it.
const SEATS = ['jaz','kira','tom','priya','sam','wren'];
const SPK = 0;
const rot = (a,k) => a.slice(k).concat(a.slice(0,k));
const PICK_ORDER = rot(SEATS, SPK);        // speaker picks first, then clockwise
const VOTE_ORDER = rot(SEATS, SPK+1);      // starts left of speaker; speaker votes last

// The seats sit on an ellipse inside a 500 × 410 box, given in percent so that the ring scales with the screen.
const seatAt = i => { const a=(-90 + i*360/SEATS.length)*Math.PI/180;
  return [(250+190*Math.cos(a))/500*100, (205+150*Math.sin(a))/410*100]; };
// out: the player who left the game, or null. Their seat stays in the ring, empty.
// drag: in re-order mode, the seat that a finger holds, the seat under the finger, and how far the finger is from the
// centre of that seat, in percent. The seat under the finger slides into the place that the held seat left.
const ringNodes = (out, drag=null) => SEATS.map((id,i)=>{
  const held = drag?.held===id, over = drag?.over===id;
  const [x,y] = held ? seatAt(SEATS.indexOf(drag.over)).map((v,k)=>v+drag.off[k])
              : over ? seatAt(SEATS.indexOf(drag.held)) : seatAt(i);
  return `<div class="seatnode ${i===SPK?'isspk':''} ${id===out?'out':''} ${held?'held':''}" style="${col(id)};left:${x}%;top:${y}%">
    ${i===SPK?'<span class="tok">★</span>':''}
    <i></i><div class="nm">${P[id].name}</div><div class="sn2">${id===out?'Left · round 3':`Seat ${i+1}`}</div></div>`;
}).join('');

const ordList = ids => ids.map((id,i)=>{
  const spk = id===SEATS[SPK];
  return `<div class="ordrow ${spk?'isspk':''}" style="${col(id)}">
    <div class="n2">${i+1}</div><div class="nm"><i></i>${P[id].name}</div>
    ${spk?'<span class="tag2">★ Speaker</span>':'<span></span>'}</div>`;
}).join('');

// drag: re-order mode, with the seat that a finger holds, as ringNodes takes it, or null.
const seatingScreen = (out=null, drag=null) => `<div class="space"></div><div class="lay">
  <div class="top stack"><div class="round"><b>Speaker &amp; seating</b> · Round 3</div>
    <div class="spacer"></div><button class="ibtn">Remove a player</button><button class="ibtn">↺ Undo</button><button class="ibtn">✕ Close</button></div>
  <div class="content split" style="--side:400px;gap:20px">
    <div class="pnl" style="display:flex;flex-direction:column">
      <div class="pnl-h">The table <span class="pnl-note">${drag?'drag a seat onto another to swap them':'tap a seat to move the speaker · hold to re-order'}</span></div>
      <div style="padding:18px 0 8px">
        <div class="ringwrap ${drag?'reorder':''}">
          <div class="cc"><div class="l">Speaker</div><div class="v">★ Jaz</div>
            <div class="s">Picks first in the strategy phase. <br>Votes last, and breaks ties.</div></div>
          ${ringNodes(out, drag)}
        </div>
      </div>
      <div style="padding:0 20px 18px;margin-top:auto">
        <div class="note-box">Seats match where people sit, so “clockwise” and “to the left” mean the same on screen as at
          the table.</div>
      </div>
    </div>
    <div class="col scroll seat-orders" style="gap:12px">
      <div class="pnl"><div class="pnl-h">Strategy pick order</div>
        <div class="ord-body"><div class="ordlist">${ordList(PICK_ORDER.filter(id=>id!==out))}</div>
          <div class="order-help">Speaker first, then clockwise.</div></div></div>
      <div class="pnl"><div class="pnl-h">Agenda voting order</div>
        <div class="ord-body"><div class="ordlist">${ordList(VOTE_ORDER.filter(id=>id!==out))}</div>
          <div class="order-help">Starts left of the speaker. The speaker votes last.</div></div></div>
      ${drag?'<button class="ibtn reorder on">✓ Done</button>':'<button class="ibtn reorder">⠿ Re-order seats</button>'}
      <div class="order-help" style="text-align:center">${drag?'A tap on two seats swaps them too. Undo takes a swap back.'
        :'Swap two seats when the ring does not match the table.'}</div>
    </div>
  </div></div>`;

S.seating = {t:'Speaker & Seating', note:
 `Seating is a <b>ring</b> set at setup; the speaker is just a <b>pointer into it</b>. Both derived
  orders fall out automatically, so moving the token is the only thing anyone ever needs to do — and the token
  does move, via Politics (3) and certain agendas. Note the two orders differ: strategy picks start <b>with</b>
  the speaker, while agenda voting starts to their <b>left and leaves the speaker until last</b>, since they
  break ties. When the ring does not match the table, an admin device swaps two seats: a <b>long press</b> on a
  seat, or <b>Re-order seats</b>, starts re-order mode. A plain tap on a seat still moves the speaker token.
  <b>Remove a player</b> in the top bar is for a player who is eliminated or goes home.`,
 mnote:
 `The ring scales down and keeps its shape, because it is a map of the real table. The two orders sit side by side under it on a phone, and Re-order seats spans both.`,
 h:seatingScreen()};

S.reorder = {t:'Speaker & Seating — Re-order Seats', note:
 `Kira and Tom sat down in each other's chairs. A <b>long press</b> of about half a second on Kira's seat starts
  re-order mode, as on the iOS home screen: every seat of a player in the game shakes, and Kira's seat lifts and
  follows the finger at once. A finger that moves before the half second scrolls the screen as usual, and a
  release before it is a plain tap that moves the speaker token. Here the finger holds Kira over Tom, so Tom's
  seat <b>slides into the gap</b> that Kira left. The drop swaps the two players on every device, and both
  orders follow. Each drop is one tap in the log: <b>Undo</b> takes it back, and the clock that runs keeps
  running. A tap on one seat and then on another swaps them too, and a second tap on the same seat lets it go,
  so the mode also works from a keyboard after <b>Re-order seats</b>. <b>Done</b>, a tap on the empty ring area,
  or Close ends the mode. The empty seat of a player who left does not shake and takes no drop. A device set to
  reduce motion shows a still dashed outline round each seat in place of the shake.`,
 mnote:
 `The same mode in the scaled ring. On a phone, Done sits under the two orders, so a tap on the empty ring area is the quick way out. A held seat stops the screen from scrolling until the finger lifts.`,
 h:seatingScreen(null, {held:'kira', over:'tom', off:[-3,-4]})};

// chosen: the player picked in the dialog. A speaker passes the token to their left.
const removeDialog = chosen => {
  const heir = chosen===SEATS[SPK] ? SEATS[(SPK+1)%SEATS.length] : null;
  return `<div class="overlay ask"><div class="dialog">
    <h3>Who leaves the game?</h3>
    <p>They take no more picks, turns, reactions, or votes. Their time so far stays in the stats.</p>
    <div class="tokopts">${SEATS.map(id=>`<button class="tokopt ${id===chosen?'on':''}" style="${col(id)}"><i></i>${P[id].name}</button>`).join('')}</div>
    ${heir?`<p class="heir">★ The speaker token passes to ${P[heir].name}, on ${P[chosen].name}’s left.</p>`:''}
    <div class="btns"><button class="ibtn">Cancel</button><button class="big small red">Remove ${P[chosen].name}</button></div>
  </div></div>`;
};

S.remove = {t:'Speaker & Seating — Remove a Player', note:
 `The table removes a player who is <b>eliminated or goes home</b>. The dialog lists the players still in the
  game: one tap chooses, and a second tap confirms. The player leaves every order at once. A clock that runs for
  them stops and moves to the next player, and a card they picked in the strategy phase returns to the common
  play area. Their recorded time stays in the stats, and Undo brings them back.`,
 mnote:
 `On a phone, the dialog opens as a sheet at the bottom of the screen, with the players two to a line and the confirm button above Cancel.`,
 h:`${seatingScreen()}${removeDialog('tom')}`};

S.removeSpeaker = {t:'Speaker & Seating — Remove the Speaker', note:
 `When the speaker leaves, the token passes to the player on their <b>left</b>, the next player clockwise, as
  the TI4 rules say. The dialog names that player before the table confirms. The speaker chip can still move
  the token afterwards, for example for a house rule.`,
 mnote:
 `The same sheet as for any other player, with the line that names the new speaker above the buttons.`,
 h:`${seatingScreen()}${removeDialog('jaz')}`};

S.seatingOut = {t:'Speaker & Seating — After a Player Leaves', note:
 `Tom left in round 3. Tom's seat <b>stays in the ring, empty</b>, so the other seats keep their places and
  their numbers. A tap on the empty seat does nothing. Both orders and the initiative order skip Tom, and
  Tom's recorded time stays in the round and game stats.`,
 mnote:
 `The empty seat keeps its place in the scaled ring. Both orders under the ring skip Tom.`,
 h:seatingScreen('tom')};

/* ── 4. Strategy phase ── */
// the six-player snapshot, and the four-player one in its second round of picks
const PICKS6 = {who:'sam', lbl:'5 of 6', cards:CARDS, order:ORDER.filter(p=>CARDS.some(c=>c.o===p.id)),
  waiting:['sam','wren'], token:true, left:2};
const PICKS4 = {who:'kira', lbl:'6 of 8 · second card', cards:CARDS4, order:ORDER4,
  waiting:[], token:false, left:3};
// `me` is the device. A seated device without admin picks only on its own pick, and the speaker and the token belong
// to admin devices.
const strategyScreen = (g=PICKS6, me=TABLE) => { const mine = me.admin || me.seat===g.who, adm = me.admin?'':' disabled';
  return `<div class="space"></div><div class="lay">
  ${topBar('str', '', me)}
  <div class="content" style="display:flex;flex-direction:column">
    <div class="picker" style="${col(g.who)}">
      <div class="who-box"><div class="lbl">Now picking · ${g.lbl}</div><div class="who"><i></i>${P[g.who].name}</div></div>
      <div class="picker-help">Order follows the speaker. Tap a card to assign it.</div>
      <button class="ibtn spkb"${adm}>★ Speaker: Jaz · change</button>
      <div class="t num" data-clock="down" data-t="27" data-limit="45">0:27</div>
    </div>
    <div class="cards grow">
      ${g.cards.map(c=>{
        const taken=!!c.o;
        return `<div class="card ${taken?'taken':mine?'next':''}" style="${taken?col(c.o):''}">
          ${!taken&&c.tg?'<div class="tg">+1 TG</div>':''}
          <div class="n num">${c.n}</div><div class="nm">${c.nm}</div>
          ${taken?`<div class="own"><i></i>${P[c.o].name}</div>`:`<div class="free">${mine?`Tap to assign to ${P[g.who].name}`:`${P[g.who].name}’s pick`}</div>`}
        </div>`}).join('')}
    </div>
    <div class="order-strip"><span class="lbl">Initiative order so far</span>
      ${g.order.map(p=>
        `<span class="oc" style="${col(p.id)}"><b>${p.init}</b><i></i>${P[p.id].name}</span>`).join('')}
      ${g.waiting.map(id=>
        `<span class="oc" style="--pc:var(--line2);color:var(--faint)"><b>?</b>${P[id].name}</span>`).join('')}
      ${g.token?`<button class="ibtn tokb" style="${col('sam')}"${adm}><b>0</b>Naalu token: Sam · change</button>`:''}</div>
  </div>
  <div class="foot"><button class="big" disabled>BEGIN ACTION PHASE — ${g.left} PICKS REMAINING</button></div>
  </div>`; };

S.strategy = {t:'Strategy Phase — Card Selection', note:
 `Picks happen in <b>speaker order</b>, one at a time, with an optional per-pick timer. As cards are claimed the app builds the initiative order along the bottom — no separate ordering step, because in TI4 the card number <b>is</b> the turn order. The one exception is the <b>Naalu "0" token</b>: its holder goes first whatever card they pick, and the strip shows them with 0 once they pick. The token button at the end of the strip only appears when a player has the Naalu faction. Unchosen cards accumulate a trade good each round, shown top-right on the card, so the strip doubles as a reminder at the table.`,
 mnote:
 `Cards go four across on an upright iPad and two across on a phone. On a phone, the picker wraps: the pick clock stays next to the name, and the help and the speaker button go under it. The token button ends the strip.`,
 h:strategyScreen()};

S.strategySeated = {t:'Strategy Phase — Seated Device', note:
 `The strategy phase on <b>Jaz's phone</b>, which holds Jaz's seat and no admin. Sam picks now, so the free cards say <b>Sam's pick</b> and do nothing on this phone. On Jaz's pick they turn on, and a tap takes the card for Jaz. Moving the speaker or the Naalu token belongs to admin devices, so those buttons are off. When every card is picked, Begin action phase reads <b>Waiting for the table</b>, because the next phase is a table tap.`,
 mnote:
 `The same picks on a phone, which is where a seated device usually is.`,
 h:strategyScreen(PICKS6, SEATED)};

S.token = {t:'Strategy Phase — Naalu 0 Token', note:
 `The Naalu player holds the <b>"0" token</b> every round, so they need no tap. When another player plays <b>Gift of Prescience</b>, the table moves the token here before the action phase begins, and that player goes first instead. The move lasts one round: the token returns to the Naalu player when the next round starts. The move is logged like every other tap, so Undo takes it back.`,
 mnote:
 `On a phone, the dialog opens as a sheet at the bottom of the screen, with the players two to a line.`,
 h:`${strategyScreen()}
  <div class="overlay ask"><div class="dialog">
    <h3>Who has the Naalu 0 token?</h3>
    <p>Move it when a player plays Gift of Prescience. The holder goes first this round, and the token returns to Sam next round.</p>
    <div class="tokopts">${SEATS.map(id=>`<button class="tokopt ${id==='sam'?'on':''}" style="${col(id)}"><i></i>${P[id].name}${id==='sam'?'<span class="tag">0 token</span>':''}</button>`).join('')}</div>
    <div class="btns"><button class="ibtn">Cancel</button></div>
  </div></div>`};

S.strategyFour = {t:'Strategy Phase — Four Players', note:
 `With 3 or 4 players, each player picks <b>two</b> strategy cards. When every player has one card, the second round starts with the <b>speaker</b> again and goes clockwise, so Jaz took a second card first and Kira picks now. The label counts every pick and names the <b>second card</b>. The strip shows each player's <b>lower</b> card, because that card alone sets their place in the turn order. With four players every card is picked, so no card gains a trade good.`,
 mnote:
 `The same second round of picks in the narrow layout, with the cards four across on an upright iPad and two across on a phone.`,
 h:strategyScreen(PICKS4)};

/* ── 5. Action phase ── */
// Pass only warns: its label counts the cards that are still to play.
const passButton = (unplayed, dis='') => `<button class="sec ${unplayed?'muted':''}"${dis}><span class="k">${
  unplayed===0 ? 'Out for the round'
  : unplayed===1 ? 'Strategy card not played yet' : 'Strategy cards not played yet'}</span>Pass</button>`;
// `held` stops the turn clock, as a reaction window does. `four` draws a four-player game. `me` is the device:
// a seated device without admin can end only its own turn, so Jaz's phone shows Kira's controls disabled.
const actionScreen = (over, held=false, four=false, me=TABLE) => { const mine = me.admin || me.seat==='kira', dis = mine?'':' disabled';
  return `<div class="space"></div><div class="lay">
  ${topBar('act', '', me)}
  <div class="body">
    <div class="hero ${over?'over':''}" style="${col('kira')}">
      ${over?`<div class="alarm"><span class="ico">🔔</span>
        <div style="flex:1"><div class="b">TURN LIMIT EXCEEDED</div>
        <div class="s">The clock is counting overtime. Nothing has ended.</div></div>
        <button class="ibtn warnish">Silence</button></div>`:''}
      <div class="hero-top">
        <div class="dot"></div>
        <div><h3>Kira</h3><div class="fac">Embers of Muaat · Seat 2</div></div>
        <div class="init"><div class="n num">5</div><div class="l">Initiative</div></div>
      </div>
      <div class="bigclock num" ${held?'':'data-clock="up"'} data-t="${over?192:107}" data-limit="180" data-bar="lb${over?'2':'1'}">${over?'3:12':'1:47'}</div>
      <div class="clock-sub">Turn ${four?3:4} this round · game total <b>${four?'15:50':'17:30'}</b>${over?' · <b>counting overtime</b>':''}</div>
      <div class="limitbar"><i id="lb${over?'2':'1'}" style="width:${over?100:59}%"></i></div>
      <div class="limitrow"><span>Turn limit 3:00</span><span data-rem="lb${over?'2':'1'}">${over?'Over by 0:12':'1:13 remaining'}</span></div>
      <div class="acts ${four?'two':''}">
        <button class="big ${over?'red':''}"${dis}>${mine?'':'<span class="k">Kira’s turn</span>'}END TURN</button>
        ${four
          ? `<button class="sec hl" style="opacity:.45" disabled><span class="k">Strategic action</span>Trade (5) played ✓</button>
        <button class="sec hl"${dis}><span class="k">Strategic action</span>Play Warfare (6) ▸</button>`
          : `<button class="sec hl"${dis}><span class="k">Strategic action</span>Play Trade (5) ▸</button>`}
        ${passButton(1, dis)}
      </div>
    </div>
    <div class="rail">
      <div class="rail-h"><span class="t">Initiative · set by strategy card</span><span class="c">${four?'1 of 4':'2 of 6'} passed</span></div>
      <div class="rail-b">${(four?ORDER4:ORDER).map(railRow).join('')}</div>
      <div class="rail-f"><span><span class="sccard" style="margin-right:5px">Card</span>still to play</span>
        <span><span class="sccard used" style="margin-right:5px">✓ Card</span>already played</span></div>
    </div>
  </div></div>`; };

S.action = {t:'Action Phase', note:
 `<b>The hero screen — roughly 90% of the game's screen time.</b> One enormous clock, one thumb-sized End Turn target. Each rail row carries its owner's <b>strategy card</b> beside the initiative number, which makes the derivation legible — the number <i>is</i> the card. The one exception is the Naalu: Sam holds the <b>"0" token</b>, so Sam's row sits first with 0 and still names Construction, the card Sam will play. Colour does double duty: a <b>blue card is still to play</b>, a <b>greyed card with a ✓ has been used</b>. That single chip answers the two questions the table actually asks — who holds Technology, and is Warfare still live — and it's also what makes Pass legal: Kira's Pass button warns that Trade is not played yet, and passing early asks first. Passed players are dimmed and struck through and are skipped automatically. Undo sits permanently in the top bar and restores <b>elapsed time</b>, not just state. The chip beside the speaker names this device's seat, Table, or Viewer, and opens Players &amp; devices.`,
 mnote:
 `The rail moves under the clock. End Turn, the strategic action, and Pass stay in the hero, under the clock, as on the iPad. The top bar takes two rows. On a phone, the rail rows become tiles in initiative order, so six players fit on one screen. Up to 740 px wide, and on a phone held sideways, the top bar is compact: the phase pill becomes a thin progress line with the phase name next to the round.`,
 h:actionScreen(false)};

S.overtime = {t:'Action Phase — Limit Exceeded', note:
 `The same screen once the limit passes. Soft expiry: the clock goes red and <b>flips to counting overtime upward</b>, an alarm sounds so the table notices without watching, and the End Turn button turns red. Nothing has advanced and nothing is blocked — the overage is simply recorded and surfaces in the round and post-game stats.`,
 mnote:
 `The same screen after the turn limit, in the narrow layout. On a phone held sideways, the clock gets smaller, so that End Turn stays in reach.`,
 h:actionScreen(true)};

S.actionFour = {t:'Action Phase — Four Players', note:
 `In a four-player game each player holds <b>two</b> strategy cards and takes <b>one turn</b> in each cycle, at their lower card. Each rail row shows both cards: blue while still to play, grey with a ✓ once used. On a turn the player can play <b>either</b> card that is still blue, so the hero shows a play button for each card. A strategic action is the whole turn: closing its window ends the turn, so the second card waits for a <b>later turn</b>. Kira played Trade on an earlier turn and can play Warfare now. Pass stays a warning until both cards are played. Tom played both cards and has passed.`,
 mnote:
 `The same four-player turn in the narrow layout. The two card buttons and Pass share the row under End Turn, and each rail row shows both cards. On a small phone, Pass takes its own row when the three buttons do not fit.`,
 h:actionScreen(false, false, true)};

S.actionSeated = {t:'Action Phase — Seated Device, Waiting', note:
 `The same screen on <b>Jaz's phone</b>. Jaz's phone holds Jaz's seat and no admin, so it acts for Jaz only, when the game waits for Jaz. It is Kira's turn, so End Turn, the strategic action, and Pass are <b>disabled, not hidden</b>: every device shows the same screen, and the disabled End Turn names the player that the game waits for. Undo and Pause need admin, so they are off too. The chip in the top bar says whose device this is and opens Players &amp; devices. On Jaz's turn the three controls come on, and the screen is the one before. A table device, or a seated device with admin, sees every control on at all times.`,
 mnote:
 `The same screen on a phone, which is where a seated device usually is. The chip in the top bar shows the colour and the name of the seat, next to the speaker chip.`,
 h:actionScreen(false, false, false, SEATED)};

S.actionViewer = {t:'Action Phase — Viewer', note:
 `The same screen on a <b>laptop that joined as a table device</b>. It has no seat and no admin yet, so it is a viewer: it sees every clock and the rail, and every control is disabled. The chip reads Viewer and opens Players &amp; devices, where the laptop can take a seat instead. When an admin turns the laptop's admin switch on, every control comes on, and the laptop acts for every player like the iPad.`,
 mnote:
 `The same screen on a phone that joined as a table device.`,
 h:actionScreen(false, false, false, VIEWER)};

/* ── 6. Reaction window ── */
const RW = [
  {id:'jaz',   done:true,  took:14},
  {id:'tom',   done:true,  took:31, passed:true},
  {id:'priya', done:true,  took:48},
  {id:'wren',  done:false, passed:true},
  {id:'sam',   done:false},
];
// earlier in round 3: Jaz, the speaker, plays Politics and hands the token to Tom
const RW_POL = [
  {id:'kira',  done:false},
  {id:'tom',   done:true,  took:9},
  {id:'priya', done:false},
  {id:'sam',   done:false},
  {id:'wren',  done:false},
];
const WINDOWS = {
  trade:{by:'kira', card:5, turn:'1:47', t:92,  tiles:RW},
  over: {by:'kira', card:5, turn:'1:47', over:18, tiles:RW},
  pol:  {by:'jaz',  card:3, turn:'0:52', t:101, tiles:RW_POL, from:'jaz', to:'tom'},
};
// past its limit the window stays open and counts overtime
const rwClock = w => w.over
  ? `<div class="t num over" data-clock="over" data-t="${w.over}">+${fmtL(w.over)}</div>

S.reaction = {t:'Reaction Window (overlay)', note:
 `The mechanic that makes a naive chess clock wrong for TI4. Playing a strategy card <b>stops the active player's clock</b> and opens a window for everyone else's secondary abilities — real table time that belongs to nobody, so it's charged to nobody. Each player taps their own tile when they're done, whether they resolved the secondary or declined it. The window closes when the last tile is marked. <b>Mark all done</b> closes it early: every player still waiting is marked done at that moment. Closing the window <b>ends Kira's turn</b>, because the strategic action was her action for the turn, and the next player's clock starts at once. Her turn keeps the 1:47 before she played the card. Note that <b>passed players still get a tile</b>: passing stops you taking turns, not resolving secondaries. A player who leaves the game during the window counts as done, and their tile shows <b>Left</b>. When the player who played the card leaves, their turn ends, and the next turn starts when the window closes. The top bar stays above the window, so the table can <b>pause</b> for a break, undo, or move the speaker during it.`,
 mnote:
 `The window opens under the top bar, so Pause, Undo, and Settings stay in reach. On a phone, it is a sheet, and each reacting player gets a row with a large Mark Done button.`,
 h:reactionScreen(WINDOWS.trade)};

// The same window a little earlier, on Jaz's phone: Jaz has not marked done yet.
const RW_SEATED = [
  {id:'jaz',   done:false},
  {id:'tom',   done:true,  took:31, passed:true},
  {id:'priya', done:true,  took:48},
  {id:'wren',  done:false, passed:true},
  {id:'sam',   done:false},
];
S.reactionSeated = {t:'Reaction Window — Seated Device', note:
 `The same window on <b>Jaz's phone</b>, which holds Jaz's seat and no admin. Jaz marks done on Jaz's own tile and on nobody else's, so the other Mark Done buttons are disabled. Kira played the card, so <b>Mark all done</b>, <b>＋ Add 1:00</b>, and the new speaker choice of a Politics window belong to Kira's device and to the admin devices. Each device reaches across the table less: five people tapping their own phones is the friction that the seat removes.`,
 mnote:
 `On a phone, the sheet gives each reacting player a row, and only Jaz's row has its Mark Done on.`,
 h:reactionScreen({by:'kira', card:5, turn:'1:47', t:92, tiles:RW_SEATED}, SEATED)};

S.reactionOver = {t:'Reaction Window — Over Limit', note:
 `The same window once its limit passes. As with every limit, expiry is soft: the window clock turns red and <b>counts overtime upward</b>, and an alarm sounds. The window stays open and nothing advances, so Sam and Wren can still mark done, and the overtime goes into the round and post-game stats. Only a tap closes the window and ends Kira's turn, so undo can always take the close back. <b>＋ Add 1:00</b> moves the limit.`,
 mnote:
 `The same overtime window in the narrow layout. On a phone, the red overtime clock sits above the tiles of the sheet.`,
 h:reactionScreen(WINDOWS.over)};

S.politics = {t:'Reaction Window — Politics', note:
 `Politics (3) is the one strategy card that moves the speaker token: its primary ability hands the token to any player who does not hold it, the Politics player included. So its window adds a <b>new speaker</b> row above the tiles, listing everyone except the speaker when the window opened. One tap moves the token, a tap on another player changes the choice, and <b>Undo</b> in the top bar reverts it. Before the first tap the row reads "Tap the player who takes the token from Jaz." The choice is optional: the window still closes, and Jaz's turn still ends, when the last player marks done. The speaker chip still works afterwards.`,
 mnote:
 `On a phone, the new speaker row puts its label above the players, and the players wrap three to a line.`,

S.passWarn = {t:'Action Phase — Pass Warning', note:

 mnote:

S.reconnecting = {t:'Action Phase — Reconnecting', note:
 `The game lives on the server, and this device has lost its connection to it. The bar under the top bar says so, and every control <b>waits</b>. A tap is not queued, because a tap that arrives late would be charged at the wrong time, and the table can tap on another device. The clocks keep running from the last state the device saw, so the screen still reads right, and the device reconnects on its own. Once it is back, the bar goes and the controls return.`,
 mnote:
 `The same bar under the compact top bar, and the screen under it dimmed.`,
 h:actionScreen(false).replace('<div class="lay">','<div class="lay offline">')
   .replace('<div class="body">','<div class="netbar"><i></i>Reconnecting · your taps wait for the connection</div><div class="body">')};


// The table paused 4:12 ago. A pause stops every clock behind the card, so the action screen drops its live clocks.
// A rule check is game time, so during one the game clock in the top bar keeps running.
const behindCard = rule => {
  const h = still(actionScreen(false));
  return rule ? h.replace(' data-t="9847"', ' data-clock="up" data-t="9847"') : h;
};
const pauseScreen = rule => `${behindCard(rule)}
  <div class="overlay"><div class="pause-card">

    <div class="l">${rule?'Game paused · only the game clock is running':'Game paused · no clock is running'}</div>
    <div class="reasons"><button${rule?'':' class="on"'}>Pause</button><button${rule?' class="on"':''}>Rule check</button></div>
    <div class="reason-time">${rule?'Rule check <b class="num" data-clock="up" data-t="83">1:23</b>':''}</div>
    <button class="big small">RESUME</button>
  </div></div>`;

S.paused = {t:'Game Paused', note:
 `Pause stops every clock, so a break costs nobody any time. The card covers the whole table, top bar included, and its clock counts up from the tap. A new pause is always a plain <b>Pause</b>: food, a phone call, a stretch. Its time counts nowhere, not even in the game time. When the table stops to settle a rule, one tap on <b>Rule check</b> starts timing the discussion.`,
 mnote:
 `The same card. On a phone, the reason buttons and Resume take the full width.`,
 h:pauseScreen(false)};

S.pausedRule = {t:'Game Paused — Rule Check', note:
 `The table paused, and later tapped <b>Rule check</b> to settle a rule. The line under the choice counts this rule check from that tap: 1:23 of the 4:12 pause. The time before the tap stays a plain pause. A rules discussion is part of playing the game, so rule-check time counts as <b>game time</b>: the game clock runs again, but every player clock stays stopped, and nobody is charged. A tap on <b>Pause</b> ends the rule check and keeps the game paused, so the table can settle a rule and then take a break. Resume also ends it. One pause can hold several rule checks, and the post-game stats show their total time and their number.`,
 mnote:
 `The same rule check in the narrow layout. The game clock in the top bar runs behind the card.`,
 h:pauseScreen(true)};

S.history = {t:'History & Undo', later:true, note:

  Undoing to an older point is the same operation repeated, so the row just says how many presses it saves.`,

 mnote:
 `On a phone, the waiting line sits at the end of the column.`,
 h:playersScreen(true, SEATED, MEMBERS_LOBBY)};

S.players = {t:'Players & Devices', note:
 `The screen that the chip in the top bar opens during the game, here on the iPad in the middle of the table. The <b>join code</b>, the link, and the QR code bring a new device to the claim screen. The link opens in a new tab. <b>Copy link</b> puts the link on the clipboard, to send in a chat, and shows ✓ Copied for a moment. When the copy fails, it says so, and the next tap tries again. Every seat lists the device that holds it, connected or away, with the <b>admin switch</b> of that device. An admin gives admin to any other device or takes it away, but never from the last admin. A device that joins as a table device is a <b>viewer</b>: it watches the game, and the switch on its row gives it admin. The table devices come last. <b>Change seat</b> opens the claim screen for this device, and <b>Leave game</b> forgets the game on this device only: the game keeps the device's place, shown as away.`,
 mnote:
 `One column: the QR code and the code first, then the seats and the devices. On a phone this is where a player checks that their seat is theirs.`,
 h:playersScreen(false)};


/* ══════════════════ shell ══════════════════ */
const GROUPS = [
  ['Every device · iPad and phone', ['home','homeSaved','homeCode','opening','openingMissing','setup','setupMissing','setupDeal','setupFailed','settings','settingsNew','claimCreator','lobby','lobbyWait','claim','players','seating','reorder','remove','removeSpeaker','seatingOut','strategy','strategySeated','token','strategyFour','action','actionSeated','actionViewer','overtime','actionFour','paused','pausedRule','reaction','reactionSeated','reactionOver','politics','passWarn','reconnecting','status','statusSeated','agenda','agendaSeated','round','roundSeated','history','stats']],
];
const KEYS = GROUPS.flatMap(g=>g[1]);
// The frames: every screen draws in each of them.
const DEVICES = {
  ipad:   {W:1194, H:834,  tag:'iPad · 1194×834'},
  tablet: {W:834,  H:1194, tag:'iPad upright · 834×1194'},
  phone:  {W:393,  H:852,  tag:'iPhone · 393×852'},
};
const ORDERED = Object.keys(DEVICES);

const nav = document.getElementById('navlist');
nav.innerHTML = GROUPS.map(([g,ks])=>
  `<div class="nav-group">${g}</div>` +
  ks.map(k=>`<div class="nav-item" data-k="${k}"><span class="idx num">${KEYS.indexOf(k)+1}</span>${S[k].t}</div>`).join('')
).join('');

const frame=document.getElementById('frame'), wrap=document.getElementById('wrap');
const devs=document.getElementById('devs');
let cur=null, dev='ipad';

// Every screen has one template for every frame; the narrow frames show the narrow note.
const layouts = s => ({ipad:s.note, tablet:s.mnote, phone:s.mnote});

// `#action` opens a screen on the iPad, `#action/tablet` upright, and `#action/phone` on the phone.
function show(k, want=dev){
  const s=S[k], ls=layouts(s), d=ls[want]!==undefined?want:Object.keys(ls)[0];
  cur=k; dev=d;
  frame.className='frame '+d;
  frame.innerHTML=`<div class="screen active table">${s.h}</div>`;
  document.getElementById('stitle').textContent=s.t;
  document.getElementById('stag').textContent=DEVICES[d].tag;
  document.getElementById('slater').hidden=!s.later;
  document.getElementById('snote').innerHTML=ls[d];
  devs.querySelectorAll('button').forEach(b=>{b.disabled=ls[b.dataset.d]===undefined; b.classList.toggle('on',b.dataset.d===d);});
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('on',n.dataset.k===k));
  try{ history.replaceState(null,'','#'+k+(d!=='ipad'?'/'+d:'')); }catch(e){}
  if(frame.querySelector('#qr')) drawQR();
  fit();
  // Overlays open under the top bar, so they need its height, as the app measures it.
  const bar=frame.querySelector('.top.game');
  if(bar) frame.style.setProperty('--top-h', bar.offsetHeight+'px');
  else frame.style.removeProperty('--top-h');
}
nav.addEventListener('click',e=>{const n=e.target.closest('.nav-item'); if(n) show(n.dataset.k);});
devs.addEventListener('click',e=>{const b=e.target.closest('button'); if(b&&!b.disabled) show(cur,b.dataset.d);});
addEventListener('keydown',e=>{
  const i=KEYS.indexOf(cur), j=ORDERED.indexOf(dev);
  if(e.key==='ArrowRight') show(KEYS[(i+1)%KEYS.length]);
  if(e.key==='ArrowLeft')  show(KEYS[(i-1+KEYS.length)%KEYS.length]);
  if(e.key==='ArrowDown'){ e.preventDefault(); show(cur, ORDERED[(j+1)%ORDERED.length]); }
  if(e.key==='ArrowUp'){ e.preventDefault(); show(cur, ORDERED[(j-1+ORDERED.length)%ORDERED.length]); }
});

function fit(){
  const {W,H}=DEVICES[ORDERED.find(d=>frame.classList.contains(d))];
  const box=wrap.parentElement.getBoundingClientRect();
  const s=Math.min((box.width-56)/W,(box.height-56)/H,1);
  frame.style.transform=`scale(${s})`;
  wrap.style.width=W*s+'px'; wrap.style.height=H*s+'px';
}
addEventListener('resize',fit);

/* fake but deterministic QR */
function drawQR(){
  const q=document.getElementById('qr'); if(!q||q.dataset.done) return;
  let h=0x5f3a7c, out='';
  for(let y=0;y<25;y++)for(let x=0;x<25;x++){
    const fin=(x<7&&y<7)||(x>17&&y<7)||(x<7&&y>17);
    const finOn=fin&&!((x>1&&x<5&&y>1&&y<5&&!(x===3&&y===3))||(x>19&&x<23&&y>1&&y<5&&!(x===21&&y===3))||(x>1&&x<5&&y>19&&y<23&&!(x===3&&y===21)));
    h=(h*1103515245+12345)&0x7fffffff;
    const on = fin ? finOn : ((h>>7)&1);
    out += on ? '<u></u>' : '<span></span>';
  }
  q.innerHTML=out; q.dataset.done=1;
}

/* live clocks */
setInterval(()=>{
  document.querySelectorAll('.screen.active [data-clock]').forEach(el=>{
    let t=+el.dataset.t, dir=el.dataset.clock, lim=+el.dataset.limit||0;
    if(dir==='down'){
      if(t>0){ t--; if(t===0) el.dataset.clock='over'; }
    } else { t++; }
    if(dir==='over') t++;
    el.dataset.t=t;
    if(el.dataset.clock==='over'){ el.textContent='+'+fmt(t); el.classList.add('over'); }
    else el.textContent=fmt(t);
    if(lim&&dir==='up'&&t>lim){
      el.classList.add('over');
      const hero=el.closest('.hero'); if(hero) hero.classList.add('over');
    }
    const bar=el.dataset.bar&&document.getElementById(el.dataset.bar);
    if(bar&&lim){
      const pct = dir==='down' ? t/lim*100 : Math.min(t/lim,1)*100;
      bar.style.width=pct+'%';
    }
    const key=el.dataset.bar||el.id;
    if(key&&lim){
      const rem=document.querySelector(`.screen.active [data-rem="${key}"]`);
      if(rem) rem.textContent = t>lim ? `over by ${fmt(t-lim)}` : `${fmt(lim-t)} remaining`;
    }
  });
},1000);

function showHash(){
  const [k, d] = decodeURIComponent(location.hash.slice(1)).split('/');
  show(S[k] ? k : 'action', DEVICES[d] ? d : 'ipad');
}
addEventListener('hashchange', showHash);
showHash();
</script>
